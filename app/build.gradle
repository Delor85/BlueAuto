plugins {
    id 'com.android.application'
}

def pilotKeystorePassword = System.getenv('BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.profitloop.blueauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.profitloop.blueauto"
        minSdk 23
        targetSdk 34
        versionCode 62
        versionName "2.9.7"
    }

    // Historical test lineage retained as documentation only: previous permanent candidate used
    // versionCode 61 / versionName "2.9.6". Active release identity is defined above.
    signingConfigs {
        pilotDebug {
            storeFile rootProject.file('.pilot-signing/debug.keystore')
            storePassword pilotKeystorePassword
            keyAlias 'androiddebugkey'
            keyPassword pilotKeystorePassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pilotDebug
        }
        release {
            signingConfig signingConfigs.pilotDebug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
