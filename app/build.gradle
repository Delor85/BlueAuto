plugins {
    id 'com.android.application'
}

def pilotKeystorePassword = System.getenv('BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.profitloop.blueauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.profitloop.blueauto"
        minSdk 23
        targetSdk 34
        versionCode 27
        versionName "2.4.3-sleep-watchdog"
    }

    signingConfigs {
        pilotDebug {
            storeFile rootProject.file('.pilot-signing/debug.keystore')
            storePassword pilotKeystorePassword
            keyAlias 'androiddebugkey'
            keyPassword pilotKeystorePassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pilotDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
