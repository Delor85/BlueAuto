plugins {
    id 'com.android.application'
}

def pilotKeystorePassword = System.getenv('BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.profitloop.blueauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.profitloop.blueauto"
        minSdk 23
        targetSdk 34
        versionCode 68
        versionName "2.9.9.4"
    }

    buildFeatures {
        buildConfig true
    }

    // Permanent-update lineage: v2.9.8 = vc63; v2.9.9 = vc64; v2.9.9.1 = vc65; v2.9.9.2 = vc66.
    // v2.9.9.3 = vc67 unified the modern Android 6+ interface.
    // v2.9.9.4 = vc68 keeps that exact architecture and repairs War Room truth fallback,
    // refresh completeness and observable button routing without changing finance/USSD rules.
    // Historical package and permanent certificate identity remain unchanged.
    signingConfigs {
        pilotDebug {
            storeFile rootProject.file('.pilot-signing/debug.keystore')
            storePassword pilotKeystorePassword
            keyAlias 'androiddebugkey'
            keyPassword pilotKeystorePassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pilotDebug
        }
        release {
            signingConfig signingConfigs.pilotDebug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}