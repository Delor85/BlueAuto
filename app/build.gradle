plugins {
    id 'com.android.application'
}

def pilotKeystorePassword = System.getenv('BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.profitloop.blueauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.profitloop.blueauto"
        minSdk 23
        targetSdk 34
        versionCode 70
        versionName "2.9.9.6"
    }

    buildFeatures {
        buildConfig true
    }

    // Permanent-update lineage: v2.9.8 = vc63; v2.9.9 = vc64; v2.9.9.1 = vc65; v2.9.9.2 = vc66.
    // v2.9.9.3 = vc67 unified the modern Android 6+ interface; v2.9.9.4 = vc68 repaired War Room truth/buttons.
    // v2.9.9.5 = vc69 converged useful 2.9.9.x capabilities onto the stable common runtime.
    // v2.9.9.6 = vc70 adds the compact EN/FR control, AI discovery rail, in-app service guide and
    // role-aware Assistant guard. PoS cannot receive DAE/DSM-only guidance or child-supply preparation.
    // Finance/USSD/Cloudflare rules and the historical package/certificate identity remain unchanged.
    signingConfigs {
        pilotDebug {
            storeFile rootProject.file('.pilot-signing/debug.keystore')
            storePassword pilotKeystorePassword
            keyAlias 'androiddebugkey'
            keyPassword pilotKeystorePassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pilotDebug
        }
        release {
            signingConfig signingConfigs.pilotDebug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
