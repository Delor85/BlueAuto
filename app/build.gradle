plugins {
    id 'com.android.application'
}

android {
    namespace 'com.profitloop.blueauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.profitloop.blueauto"
        minSdk 23
        targetSdk 34
        versionCode 21
        versionName "2.1.0-field-fix"
    }

    signingConfigs {
        pilotDebug {
            storeFile rootProject.file('.pilot-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pilotDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
