name: BIR v2.9.4 final Accessibility reboot qualification

on:
  pull_request:
    branches: [main]
    paths: ['.github/v294-accessibility-final.trigger']

permissions:
  contents: read
  actions: read

concurrency:
  group: bir-v294-accessibility-final
  cancel-in-progress: true

env:
  BIR_V294_SOURCE_SHA: 4e5d5ac1d1d7c214c433aa608376dbba647399e2
  BIR_V294_ARTIFACT_RUN_ID: '32273123427'
  BIR_V294_APK_SHA256: f04a836c27d30af56af1015580987d20b0dd9534e5dea84d4deba51b35f8ee5a
  BIR_V294_EXACT_APK: /tmp/BIR-v2.9.4-code59-EPHEMERAL.apk

jobs:
  prove-exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V294_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.4-war-room-EPHEMERAL
          path: /tmp/bir-v294
          repository: Delor85/BlueAuto
          run-id: ${{ env.BIR_V294_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Prove source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIR_V294_SOURCE_SHA"
          apk="$(find /tmp/bir-v294 -type f -name 'app-release.apk' -print -quit)"
          source_sha="$(find /tmp/bir-v294 -type f -name 'v294-source-sha.txt' -print -quit)"
          test -f "$apk" && test -f "$source_sha"
          sha256sum "$apk" | grep "$BIR_V294_APK_SHA256"
          grep -qx "$BIR_V294_SOURCE_SHA" "$source_sha"

  accessibility-reboot:
    name: Accessibility recovery Android ${{ matrix.label }}
    needs: prove-exact-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 23, arch: x86, profile: "Nexus 5", label: "6/API23"}
          - {api: 30, arch: x86_64, profile: "Nexus 6", label: "11/API30"}
          - {api: 34, arch: x86_64, profile: "pixel_2", label: "14/API34"}
          - {api: 36, arch: x86_64, profile: "pixel_2", label: "16/API36"}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.4-war-room-EPHEMERAL
          path: /tmp/bir-v294
          repository: Delor85/BlueAuto
          run-id: ${{ env.BIR_V294_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Normalize exact APK path
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find /tmp/bir-v294 -type f -name 'app-release.apk' -print -quit)"
          test -f "$apk"
          cp "$apk" "$BIR_V294_EXACT_APK"
          sha256sum "$BIR_V294_EXACT_APK" | grep "$BIR_V294_APK_SHA256"
      - name: Verify service registration, 150s window, reboot and safe reconnect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            sha256sum /tmp/BIR-v2.9.4-code59-EPHEMERAL.apk | grep "$BIR_V294_APK_SHA256"
            adb wait-for-device
            timeout 300 sh -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 5; done'
            rm -f /tmp/access-install.txt
            sh -c 'for attempt in 1 2 3; do adb install -r /tmp/BIR-v2.9.4-code59-EPHEMERAL.apk 2>&1 | tee /tmp/access-install.txt; grep -q Success /tmp/access-install.txt && exit 0; adb reconnect >/dev/null 2>&1 || true; adb wait-for-device || true; sleep 10; done; exit 1'
            adb shell settings put secure enabled_accessibility_services com.profitloop.blueauto/com.profitloop.blueauto.BlueAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity > /tmp/access-start.txt
            grep -q 'Status: ok' /tmp/access-start.txt
            sleep 10
            adb shell settings get secure enabled_accessibility_services | grep -q 'com.profitloop.blueauto'
            sleep 150
            adb shell settings get secure enabled_accessibility_services | grep -q 'com.profitloop.blueauto'
            adb reboot
            adb wait-for-device
            timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            adb shell settings get secure enabled_accessibility_services | grep -q 'com.profitloop.blueauto'
            adb shell settings get secure accessibility_enabled | tee /tmp/access-master-after-reboot.txt
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity > /tmp/access-reboot.txt
            grep -q 'Status: ok' /tmp/access-reboot.txt
            sleep 10
            adb shell settings get secure enabled_accessibility_services | grep -q 'com.profitloop.blueauto'
            adb shell settings get secure accessibility_enabled | grep -q '^1$'
            adb shell dumpsys accessibility > /tmp/access-dumpsys.txt || true
            grep -q 'com.profitloop.blueauto' /tmp/access-dumpsys.txt || adb shell settings get secure enabled_accessibility_services | grep -q 'com.profitloop.blueauto'
            adb logcat -d -b crash > /tmp/access-reboot-crash.txt || true
            ! grep -q com.profitloop.blueauto /tmp/access-reboot-crash.txt
