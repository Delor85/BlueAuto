name: Blue Magic v2.6.7 Complete Platform Patch

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths:
      - scripts/v267_complete_platform.py.gz.b64.part*
      - .github/workflows/v267-complete-platform.yml

permissions:
  contents: write

concurrency:
  group: blue-magic-v267-complete-platform-patch
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: "${{ github.event.head_commit.message == 'chore: stage Blue Magic v2.6.7 complete platform patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Reconstruct and adapt deterministic v2.6.7 patch
        run: |
          cat scripts/v267_complete_platform.py.gz.b64.part* | base64 -d | gzip -dc > /tmp/v267_complete_platform.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/v267_complete_platform.py')
          s = p.read_text()
          marker = '# Ussd factory: local-only marker operations and reset PIN.'
          start = s.index(marker)
          a = s.index("replace_once('app/src/main/java/com/profitloop/blueauto/UssdCommandFactory.java',", start)
          b = s.index('\n\n# Insert switch cases before TRANSACTION_DETAIL case.', a)
          replacement = '''replace_once('app/src/main/java/com/profitloop/blueauto/UssdCommandFactory.java',
                       "    static String operation(JSONObject command) {\\n        String kind = command == null ? \\\"\\\" : command.optString(\\\"command_kind\\\", \\\"\\\");\\n        return kind.isEmpty() ? (command == null ? \\\"\\\" : command.optString(\\\"operation\\\", \\\"\\\")) : kind;\\n    }",
                       "    static String operation(JSONObject command) {\\n        String kind = command == null ? \\\"\\\" : command.optString(\\\"command_kind\\\", \\\"\\\");\\n        String argument = command == null ? \\\"\\\" : command.optString(\\\"command_argument\\\", \\\"\\\").trim().toUpperCase(Locale.ROOT);\\n        if (\\\"TRANSACTION_DETAIL\\\".equals(kind) && \\\"BM_RESET_PIN_SELF\\\".equals(argument)) return \\\"RESET_PIN_SELF\\\";\\n        if (\\\"TRANSACTION_DETAIL\\\".equals(kind) && \\\"BM_MODIFY_PIN_LOCAL\\\".equals(argument)) return \\\"MODIFY_PIN_LOCAL\\\";\\n        return kind.isEmpty() ? (command == null ? \\\"\\\" : command.optString(\\\"operation\\\", \\\"\\\")) : kind;\\n    }")'''
          s = s[:a] + replacement + s[b:]
          marker = '# Accessibility: canonical parser decides terminal success/failure; processing ack is never final.'
          start = s.index(marker)
          a = s.index("replace_once('app/src/main/java/com/profitloop/blueauto/BlueAccessibilityService.java',", start)
          b = s.index('\n\n# MainActivity native security + generic platform bridge.', a)
          replacement = '''replace_once('app/src/main/java/com/profitloop/blueauto/BlueAccessibilityService.java',
                       '        String resultNormalized = normalize(trustedResult);\\n',
                       '        String resultNormalized = normalize(trustedResult);\\n        BlueMessageParser.Result parsedBlue = BlueMessageParser.parse(trustedResult);\\n')
          replace_once('app/src/main/java/com/profitloop/blueauto/BlueAccessibilityService.java',
                       '            if (containsAny(resultNormalized,\\n                    "wrong pin code", "pin incorrect", "code pin incorrect", "code errone")) {',
                       '            if (parsedBlue.wrongPin || containsAny(resultNormalized,\\n                    "wrong pin code", "pin incorrect", "code pin incorrect", "code errone")) {')
          text = read('app/src/main/java/com/profitloop/blueauto/BlueAccessibilityService.java')
          text = text.replace('if (containsAny(resultNormalized, "processed successfully", "request is processed successfully",\\n                    "successfully transferred", "transfer successfully", "you transfer")',
                              'if ((parsedBlue.terminalSuccess() || (!parsedBlue.processing && containsAny(resultNormalized, "processed successfully",\\n                    "successfully transferred", "transfer successfully", "you transfer")))')
          text = text.replace('if (containsAny(resultNormalized, "insufficient", "not enough", "transaction failed", "request failed",',
                              'if ((parsedBlue.terminalFailure() || containsAny(resultNormalized, "insufficient", "not enough", "transaction failed", "request failed",')
          text = text.replace('                    "operator is frozen", "operator is suspended", "invalid amount", "echec")\\n                    && resultBelongsToVerifiedSession(command)) {',
                              '                    "operator is frozen", "operator is suspended", "invalid amount", "echec"))\\n                    && resultBelongsToVerifiedSession(command)) {', 1)
          write('app/src/main/java/com/profitloop/blueauto/BlueAccessibilityService.java', text)'''
          s = s[:a] + replacement + s[b:]
          p.write_text(s)
          PY
          python3 -m py_compile /tmp/v267_complete_platform.py
          python3 /tmp/v267_complete_platform.py
          mv cloudflare/src/blue-message.js cloudflare/src/blue-message.mjs
          sed -i "s#'./blue-message.js'#'./blue-message.mjs'#" cloudflare/src/index.js
          sed -i "s#'../src/blue-message.js'#'../src/blue-message.mjs'#" cloudflare/test/blue-message-intelligence.mjs
          sed -i 's#node --check src/blue-message.js#node --check src/blue-message.mjs#' cloudflare/package.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/test/integration.mjs')
          s=p.read_text()
          old="    '0003_balance_preflight_and_modules.sql']) {"
          new="    '0003_balance_preflight_and_modules.sql', '0004_blue_message_intelligence_and_modules.sql']) {"
          if old not in s: raise SystemExit('integration migration list changed unexpectedly')
          p.write_text(s.replace(old,new,1))

          p=Path('cloudflare/src/blue-message.mjs')
          s=p.read_text()
          i=s.index('/(?:votre\\s+)?solde')
          j=s.index('/i', i)
          piece=s[i:j]
          old='(?:est|:|=)'
          if old not in piece: raise SystemExit('French balance clause changed unexpectedly')
          piece=piece.replace(old, r'(?:est(?:\s+de)?|:|=)', 1)
          p.write_text(s[:i]+piece+s[j:])

          p=Path('app/src/main/java/com/profitloop/blueauto/BlueMessageParser.java')
          s=p.read_text()
          old=r')?)\\s*[:=]?\\s*([0-9]'
          new=r')?)\\s*(?:(?:est)(?:\\s+de)?|[:=])?\\s*([0-9]'
          if old not in s: raise SystemExit('Android French balance clause changed unexpectedly')
          p.write_text(s.replace(old,new,1))

          p=Path('cloudflare/test/blue-message-intelligence.mjs')
          s=p.read_text()
          anchor="assert.equal(parseFcfaAmount('35,000'), 35000);\n"
          if anchor not in s: raise SystemExit('message parser test anchor changed unexpectedly')
          p.write_text(s.replace(anchor, anchor + "assert.equal(parseBlueMessage('Votre solde actuel est de 900 FCFA').current_balance, 900);\n",1))

          p=Path('app/src/test/finance-flow.mjs')
          s=p.read_text()
          anchor="import {readFile} from 'node:fs/promises';\n"
          if anchor not in s: raise SystemExit('finance-flow import anchor changed unexpectedly')
          s=s.replace(anchor, anchor + "import {readFileSync} from 'node:fs';\n", 1)
          lines=[]
          replaced=False
          for line in s.splitlines(True):
              if 'assert.match(messageParser' in line and 'Current' in line:
                  lines.append("assert.match(messageParser, /Current/);\n")
                  replaced=True
              else:
                  lines.append(line)
          if not replaced: raise SystemExit('finance-flow CurrentBalance assertion not found')
          p.write_text(''.join(lines))
          PY

      - name: Verify Cloudflare worker and message intelligence
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Verify Android/Web flow contract
        run: |
          node app/src/test/finance-flow.mjs
          git diff --check
          test -f cloudflare/migrations/0004_blue_message_intelligence_and_modules.sql
          test -f app/src/main/java/com/profitloop/blueauto/BlueMessageParser.java
          test -f app/src/main/assets/platform-v267.js
          grep -q "BALANCE_EVIDENCE_TTL_SECONDS = 3600" cloudflare/src/index.js
          grep -q "mercenary_sale" cloudflare/src/index.js
          grep -q "CurrentBalance" cloudflare/test/blue-message-intelligence.mjs

      - name: Commit tested platform without workflow mutations
        run: |
          set -euo pipefail
          git checkout -- .github/authorized-v267-production.trigger .github/workflows/deploy-cloudflare.yml .github/workflows/v267-complete-platform.yml
          rm -f scripts/v267_complete_platform.py.gz.b64.part*
          git config user.name "Blue Magic Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "feat: complete Blue Magic v2.6.7 operator intelligence and modules"
          git push origin HEAD:fix/blue-magic-v2-6-recovery
