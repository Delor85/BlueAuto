name: BIR v2.9.9.3 Android11 + Child War Room Qualification

on:
  push:
    branches: [fix/bir-v2-9-9-3-android11-child-warroom-tchoronko]
    paths:
      - 'app/**'
      - '.github/workflows/v2993-android11-child-warroom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bir-v2993-${{ github.ref }}
  cancel-in-progress: true

env:
  BIR_V2992_SHA: abde508132568ef1c9eefb6ee058db21af5577a2

jobs:
  validate-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove additive boundary and exact identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_V2992_SHA" -- cloudflare
          grep -q 'versionCode 67' app/build.gradle
          grep -q 'versionName "2.9.9.3"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          grep -q '<bool name="bir_main_hardware_accelerated">true</bool>' app/src/main/res/values-v30/bir_rendering.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stable finance/v297 contracts using their historical version fixture
        shell: bash
        run: |
          set -euo pipefail
          cp app/build.gradle /tmp/build.gradle.v2993
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 67','versionCode 64').replace('versionName "2.9.9.3"','versionName "2.9.9"')
          p.write_text(s)
          PY
          node app/src/test/finance-flow.mjs
          node app/src/test/bir-v297-field-resilience.mjs
          mv /tmp/build.gradle.v2993 app/build.gradle
          git diff --exit-code -- app/build.gradle
      - name: Run v2993 invariants and syntax on exact source
        shell: bash
        run: |
          set -euo pipefail
          node app/src/test/v2993-child-warroom-tchoronko-android11-contract.mjs
          for f in app/src/main/assets/app.js app/src/main/assets/field-ops-v297.js app/src/main/assets/war-room-v294.js app/src/main/assets/intelligence-v297.js app/src/main/assets/field-runtime-v2993.js; do node --check "$f"; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Build exact qualification APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR 2.9.9.3 Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/aapt" dump badging "$apk" | tee /tmp/v2993-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='67' versionName='2.9.9.3'" /tmp/v2993-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v2993-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v2993-badging.txt
          ! grep -q 'application-debuggable' /tmp/v2993-badging.txt
          sha256sum "$apk" | tee /tmp/v2993-qualification.sha256
          git rev-parse HEAD | tee /tmp/v2993-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.3-Qualification
          retention-days: 7
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
            /tmp/v2993-badging.txt
            /tmp/v2993-qualification.sha256
            /tmp/v2993-source-sha.txt

  android-webview:
    name: Android ${{ matrix.android }} / API ${{ matrix.api }} — actual BIR WebView
    needs: validate-build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {android: '6', api: 23, arch: x86, profile: 'Nexus 5', stress: 12}
          - {android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X', stress: 12}
          - {android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X', stress: 60}
          - {android: '14', api: 34, arch: x86_64, profile: 'Nexus 5X', stress: 16}
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.3-Qualification
          path: apk
      - name: Install, seed a local DAE profile, open actual WebView and stress it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -eu
            adb wait-for-device
            ready=0
            for i in $(seq 1 60); do
              if adb shell service check package 2>/dev/null | grep -qi found && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi
              sleep 5
            done
            test "$ready" = 1
            apk="$(find apk -type f -name 'BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk' -print -quit)"
            test -s "$apk"
            adb install --no-streaming "$apk"
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=67'
            adb root >/tmp/adb-root.txt 2>&1 || true
            adb wait-for-device
            adb shell id | grep -q 'uid=0(root)'
            uid="$(adb shell dumpsys package com.profitloop.blueauto | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            test -n "$uid"
            cat >/tmp/bir-prefs.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="active_profile_id_v3">ci-dae</string>
              <string name="profiles_v3">[{"id":"ci-dae","api_url":"https://127.0.0.1/api","device_token":"ci-token-not-production","node_code":"OU3","official_node_code":"OU3","phone_number":"690000000","parent_node_code":"","official_parent_node_code":"","role":"DAE","device_mode":"REMOTE","sim_slot":0}]</string>
            </map>
            XML
            adb push /tmp/bir-prefs.xml /data/local/tmp/bir-prefs.xml >/dev/null
            adb shell "mkdir -p /data/user/0/com.profitloop.blueauto/shared_prefs && cp /data/local/tmp/bir-prefs.xml /data/user/0/com.profitloop.blueauto/shared_prefs/blue_magic_native_v2.xml && chown -R $uid:$uid /data/user/0/com.profitloop.blueauto"
            adb shell am force-stop com.profitloop.blueauto
            adb logcat -c || true
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity >/tmp/start.txt
            grep -Eq 'Status: ok|Complete' /tmp/start.txt
            sleep 7
            adb shell uiautomator dump /sdcard/bir-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/bir-window.xml /tmp/bir-window.xml >/dev/null 2>&1 || true
            test -s /tmp/bir-window.xml
            grep -q 'WAR ROOM DES ENFANTS' /tmp/bir-window.xml
            i=0
            while [ "$i" -lt "${{ matrix.stress }}" ]; do
              adb shell input swipe 530 1450 530 580 180 || true
              adb shell input tap 520 900 || true
              adb shell input swipe 530 580 530 1450 180 || true
              i=$((i+1))
            done
            sleep 4
            adb shell pidof com.profitloop.blueauto >/dev/null
            adb exec-out screencap -p >/tmp/final.png
            test -s /tmp/final.png
            adb logcat -d >/tmp/logcat.txt || true
            ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto|ANR in com.profitloop.blueauto|Render process.*gone|crash_dump.*webview' /tmp/logcat.txt

  qualification-summary:
    needs: [validate-build, android-webview]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo 'B.I.R. 2.9.9.3 exact candidate passed actual-WebView Android 6/8/11/14 qualification.'
          echo 'Android 11 uses the proven pre-2.9.8 UI foundation plus isolated v2993 child War Room/Tchoronko.'
          echo 'No Worker/D1 mutation is performed.'
