name: BIR v2.9.9.3 Unified Android 6-16 Qualification

on:
  push:
    branches: [fix/bir-v2-9-9-3-android11-child-warroom-tchoronko]
    paths:
      - 'app/**'
      - '.github/workflows/v2993-android11-child-warroom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bir-v2993-${{ github.ref }}
  cancel-in-progress: true

env:
  BIR_V2992_SHA: abde508132568ef1c9eefb6ee058db21af5577a2

jobs:
  validate-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove production boundary and exact release identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_V2992_SHA" -- cloudflare
          grep -q 'versionCode 67' app/build.gradle
          grep -q 'versionName "2.9.9.3"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          grep -q 'intelligence-v297-core.js' app/src/main/assets/intelligence-v297.js
          grep -q 'field-runtime-v2993.js' app/src/main/assets/intelligence-v297.js
          ! grep -Eq 'transaction-first-v298|reference-stability-v299|field-runtime-v2991|field-runtime-v2992|api30\(|bir-v2993-api30-legacy' app/src/main/assets/intelligence-v297.js
          ! grep -q 'bir_main_hardware_accelerated' app/src/main/AndroidManifest.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stable finance/v297 contracts using their historical version fixture
        shell: bash
        run: |
          set -euo pipefail
          cp app/build.gradle /tmp/build.gradle.v2993
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 67','versionCode 64').replace('versionName "2.9.9.3"','versionName "2.9.9"')
          p.write_text(s)
          PY
          node app/src/test/finance-flow.mjs
          node app/src/test/bir-v297-field-resilience.mjs
          mv /tmp/build.gradle.v2993 app/build.gradle
          git diff --exit-code -- app/build.gradle
      - name: Run unified Android 6+ invariants and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node app/src/test/v2993-child-warroom-tchoronko-android11-contract.mjs
          for f in app/src/main/assets/app.js app/src/main/assets/field-ops-v297.js app/src/main/assets/war-room-v294.js app/src/main/assets/intelligence-v297.js app/src/main/assets/intelligence-v297-core.js app/src/main/assets/field-runtime-v2993.js; do node --check "$f"; done
          bash -n app/src/test/v2993-webview-smoke.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Build exact qualification APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR 2.9.9.3 Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/aapt" dump badging "$apk" | tee /tmp/v2993-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='67' versionName='2.9.9.3'" /tmp/v2993-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v2993-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v2993-badging.txt
          ! grep -q 'application-debuggable' /tmp/v2993-badging.txt
          sha256sum "$apk" | tee /tmp/v2993-qualification.sha256
          git rev-parse HEAD | tee /tmp/v2993-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.3-Qualification
          retention-days: 7
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.3-vc67-Qualification.apk
            /tmp/v2993-badging.txt
            /tmp/v2993-qualification.sha256
            /tmp/v2993-source-sha.txt

  android-webview:
    name: Android ${{ matrix.android }} / API ${{ matrix.api }} — same modern BIR WebView
    needs: validate-build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {android: '6', api: 23, arch: x86, profile: 'Nexus 5', stress: 12}
          - {android: '7', api: 24, arch: x86, profile: 'Nexus 5', stress: 12}
          - {android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X', stress: 12}
          - {android: '9', api: 28, arch: x86_64, profile: 'Nexus 5X', stress: 12}
          - {android: '10', api: 29, arch: x86_64, profile: 'Nexus 5X', stress: 16}
          - {android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X', stress: 60}
          - {android: '12', api: 31, arch: x86_64, profile: 'Nexus 5X', stress: 20}
          - {android: '13', api: 33, arch: x86_64, profile: 'Nexus 5X', stress: 20}
          - {android: '14', api: 34, arch: x86_64, profile: 'Nexus 5X', stress: 20}
          - {android: '15', api: 35, arch: x86_64, profile: 'Nexus 5X', stress: 20}
          - {android: '16', api: 36, arch: x86_64, profile: 'Nexus 5X', stress: 20}
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.3-Qualification
          path: apk
      - name: Install exact APK and stress the same current WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash app/src/test/v2993-webview-smoke.sh ${{ matrix.stress }}

  qualification-summary:
    needs: [validate-build, android-webview]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo 'B.I.R. 2.9.9.3 exact candidate passed the same modern WebView on Android 6 through Android 16.'
          echo 'No Android 11 visual/functional fork is allowed; all versions use v2.9.7 Intelligence/Cockpit foundation + current v2.9.9.3 additive features.'
          echo 'No Worker/D1 mutation is performed.'
