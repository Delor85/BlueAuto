name: BIR v2.9.3 permanent APK

on:
  workflow_dispatch:
    inputs:
      publish_permanent:
        description: "Signer/publier l'APK permanent v2.9.3"
        required: true
        type: boolean
        default: false
      authorized_sha:
        description: "SHA source v2.9.3 autorisé"
        required: true
        type: string
        default: ""

permissions:
  contents: read

env:
  BIR_V293_SOURCE_SHA: 33a15f4eb7e0c04b0dac8c82837037396c49cea2
  BIR_PERMANENT_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  permanent-v293:
    if: "${{ inputs.publish_permanent == true && inputs.authorized_sha == '33a15f4eb7e0c04b0dac8c82837037396c49cea2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BLUE_MAGIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
      BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V293_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove immutable source and package identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIR_V293_SOURCE_SHA"
          test "${{ inputs.authorized_sha }}" = "$BIR_V293_SOURCE_SHA"
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'versionCode 58' app/build.gradle
          grep -q 'versionName "2.9.3"' app/build.gradle
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main

      - name: Setup Java 17 and Gradle 8.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore permanent signing key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUE_MAGIC_ANDROID_KEYSTORE_BASE64"
          test -n "$BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$BLUE_MAGIC_ANDROID_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          keytool -list -v -keystore .pilot-signing/debug.keystore \
            -storepass "$BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD" -alias androiddebugkey > /tmp/key-info.txt
          cert=$(grep -i 'SHA256:' /tmp/key-info.txt | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          test "$cert" = "$BIR_PERMANENT_CERT_SHA256"
          rm -f /tmp/key-info.txt

      - name: Re-run all Android/WebView contracts and assemble permanent release
        shell: bash
        run: |
          set -euo pipefail
          for test in app/src/test/*.mjs; do node "$test"; done
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" /tmp/BIR-v2.9.3-code58-PERMANENT.apk

      - name: Verify permanent APK identity and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/BIR-v2.9.3-code58-PERMANENT.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$build_tools/aapt" dump badging "$APK" | tee /tmp/v293-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='58' versionName='2.9.3'" /tmp/v293-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/v293-cert.txt
          cert=$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/v293-cert.txt | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          test "$cert" = "$BIR_PERMANENT_CERT_SHA256"
          sha256sum "$APK" | tee /tmp/v293-permanent-sha256.txt
          git rev-parse HEAD | tee /tmp/v293-permanent-source-sha.txt

      - name: Upload permanent release evidence
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.3-code58-PERMANENT
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/BIR-v2.9.3-code58-PERMANENT.apk
            /tmp/v293-permanent-sha256.txt
            /tmp/v293-permanent-source-sha.txt
            /tmp/v293-badging.txt
            /tmp/v293-cert.txt
