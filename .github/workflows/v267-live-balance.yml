name: Blue Magic v2.6.7 Live Balance Hardening

on:
  push:
    branches:
      - fix/blue-magic-v2-6-recovery
    paths:
      - .github/workflows/v267-live-balance.yml

permissions:
  contents: write

jobs:
  harden-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Apply audited live-balance patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/v267-live-balance-patch.py')
          s = p.read_text()
          s = s.replace(r'replaceAll("\\D"', r'replaceAll("\\\\D"')
          s = s.replace("request_type: 'CHILD_BALANCE', target_node_code: 'DSM-TEST',\n    client_request_id: 'integration-child-balance-attribution-01'", "request_type: 'CHILD_BALANCE', target_node_code: 'DSM-TEST_DAE-TEST',\n    client_request_id: 'integration-child-balance-attribution-01'")
          p.write_text(s)
          PY
          python3 scripts/v267-live-balance-patch.py

      - name: Test Worker and D1
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Test Android and web contract
        run: |
          node app/src/test/finance-flow.mjs
          git diff --check
          grep -q evidence_priority cloudflare/migrations/0004_blue_message_intelligence_and_modules.sql
          grep -q balance_reusable cloudflare/src/index.js
          grep -q parseMiniStatementEntries cloudflare/src/blue-message.mjs
          if grep -q 'RobotService.requestAudit(context, profileId)' app/src/main/java/com/profitloop/blueauto/SmsReceiver.java; then exit 1; fi

      - name: Commit tested business source
        run: |
          set -euo pipefail
          git config user.name 'Blue Magic Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/migrations/0004_blue_message_intelligence_and_modules.sql
          git add cloudflare/src/index.js cloudflare/src/blue-message.mjs
          git add cloudflare/test/blue-message-intelligence.mjs cloudflare/test/integration.mjs
          git add app/src/main/java/com/profitloop/blueauto/BlueMessageParser.java
          git add app/src/main/java/com/profitloop/blueauto/SmsReceiver.java
          git add app/src/main/assets/app.js app/src/test/finance-flow.mjs
          git diff --cached --check
          git commit -m 'feat: make v2.6.7 balances canonical live shared state'
          git push origin HEAD:fix/blue-magic-v2-6-recovery
