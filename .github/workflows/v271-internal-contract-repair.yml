name: BIR v2.7.1 Internal Contract Repair

on:
  push:
    branches: [fix/bir-v2-7-1-field-stabilization]
    paths: [.github/authorized-v271-internal-repair.trigger]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/bir-v2-7-1-field-stabilization
          fetch-depth: 0
      - name: Restore internal DOM API without reverting visible Blue branding
        run: |
          set -euo pipefail
          python3 .github/scripts/v271_internal_contract_repair.py
          if ! git diff --quiet -- cloudflare; then
            echo '::error::Internal repair touched cloudflare/.'
            exit 1
          fi
          node app/src/test/bir-v269-functional-contract.mjs
          node app/src/test/v271-field-stabilization-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/control-tower-v271.js
      - name: Commit product repair
        run: |
          set -euo pipefail
          git config user.name 'Delor85'
          git config user.email 'mbolodelorpro@gmail.com'
          git add app/src/main/assets/index.html app/src/main/assets/app.js app/src/main/assets/control-tower-v271.js
          if git diff --cached --quiet; then
            echo '::error::No repair changes produced.'
            exit 1
          fi
          git commit -m 'fix: preserve internal balance DOM contract under Blue branding [v271-source]'
          git push origin HEAD:fix/bir-v2-7-1-field-stabilization
