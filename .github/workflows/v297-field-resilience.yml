name: BIR v2.9.7 Field Resilience validation

on:
  push:
    branches: [fix/bir-v2-9-7-field-resilience-ai]
  pull_request:
    branches: [fix/bir-v2-9-5-identity-balance-sync]
    paths:
      - 'app/**'
      - '.github/workflows/v297-field-resilience.yml'

permissions:
  contents: read

concurrency:
  group: bir-v297-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  BIR_PERMANENT_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove production boundaries
        run: |
          set -euo pipefail
          git diff --exit-code a6cdf9edf7729cdcaa052ab51926b247064b6e23 -- cloudflare
          test ! -e cloudflare/migrations/0012_bir_v297.sql
          grep -q 'versionCode 62' app/build.gradle
          grep -q 'versionName "2.9.7"' app/build.gradle

      - name: Validate Worker source locally
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)

      - name: Validate WebView and regression contracts
        run: |
          set -euo pipefail
          for test_file in app/src/test/*.mjs; do echo "== $test_file =="; node "$test_file"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/war-room-v294.js
          node --check app/src/main/assets/field-ops-v297.js
          grep -q 'field-ops-v297.css' app/src/main/assets/index.html
          grep -q 'field-ops-v297.js' app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Prepare ephemeral validation signature
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          validation_password="$(openssl rand -hex 32)"
          echo "::add-mask::$validation_password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$validation_password" -alias androiddebugkey -keypass "$validation_password" -dname 'CN=BIR v2.9.7 Validation,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$validation_password" >> "$GITHUB_ENV"

      - name: Test and assemble Release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK identity
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk_path=app/build/outputs/apk/release/app-release.apk
          "$build_tools/zipalign" -c -v 4 "$apk_path"
          "$build_tools/aapt" dump badging "$apk_path" | tee /tmp/bir-v297-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='62' versionName='2.9.7'" /tmp/bir-v297-badging.txt
          grep -q "application-label:'B.I.R. — Blue Infinity Retail'" /tmp/bir-v297-badging.txt
          ! grep -q 'application-debuggable' /tmp/bir-v297-badging.txt
          sha256sum "$apk_path" | tee /tmp/bir-v297-apk.sha256

      - name: Upload ephemeral candidate
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.7-field-resilience-EPHEMERAL
          path: |
            app/build/outputs/apk/release/app-release.apk
            /tmp/bir-v297-badging.txt
            /tmp/bir-v297-apk.sha256
          if-no-files-found: error
          retention-days: 7

  permanent-field-apk:
    needs: validate-and-build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BLUE_MAGIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
      BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove immutable source and no production delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code a6cdf9edf7729cdcaa052ab51926b247064b6e23 -- cloudflare
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'versionCode 62' app/build.gradle
          grep -q 'versionName "2.9.7"' app/build.gradle
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run source contracts before permanent signing
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)
          for test_file in app/src/test/*.mjs; do node "$test_file"; done
          node --check app/src/main/assets/field-ops-v297.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore and prove permanent certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUE_MAGIC_ANDROID_KEYSTORE_BASE64"
          test -n "$BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$BLUE_MAGIC_ANDROID_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD" -alias androiddebugkey > /tmp/key-info.txt
          cert=$(grep -i 'SHA256:' /tmp/key-info.txt | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          test "$cert" = "$BIR_PERMANENT_CERT_SHA256"
          rm -f /tmp/key-info.txt

      - name: Build permanent Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" /tmp/BIR-Blue-Infinity-Retail-v2.9.7-vc62-PERMANENT.apk

      - name: Verify permanent APK identity, certificate and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/BIR-Blue-Infinity-Retail-v2.9.7-vc62-PERMANENT.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$build_tools/zipalign" -c -v 4 "$APK"
          "$build_tools/aapt" dump badging "$APK" | tee /tmp/v297-permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='62' versionName='2.9.7'" /tmp/v297-permanent-badging.txt
          grep -q "application-label:'B.I.R. — Blue Infinity Retail'" /tmp/v297-permanent-badging.txt
          ! grep -q 'application-debuggable' /tmp/v297-permanent-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/v297-permanent-cert.txt
          cert=$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/v297-permanent-cert.txt | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          test "$cert" = "$BIR_PERMANENT_CERT_SHA256"
          sha256sum "$APK" | tee /tmp/v297-permanent-sha256.txt
          git rev-parse HEAD | tee /tmp/v297-permanent-source-sha.txt

      - name: Upload permanent APK
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.7-code62-PERMANENT
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/BIR-Blue-Infinity-Retail-v2.9.7-vc62-PERMANENT.apk
            /tmp/v297-permanent-sha256.txt
            /tmp/v297-permanent-source-sha.txt
            /tmp/v297-permanent-badging.txt
            /tmp/v297-permanent-cert.txt