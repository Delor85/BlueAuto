name: BIR v2.9.3 Field Coherence Diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/v293-field-diagnostic.trigger']

permissions:
  contents: read

env:
  BIR_PRODUCTION_HEALTH_URL: https://blue-magic-api.mbolodelorpro.workers.dev/api?action=health

jobs:
  diagnose-production-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Cloudflare tooling
        working-directory: cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/prepare-production-config.mjs
          npx wrangler deploy --dry-run --config wrangler.production.jsonc >/tmp/v293-dryrun.txt
      - name: Verify current production before diagnosis
        run: |
          set -euo pipefail
          curl --fail --retry 4 --retry-delay 2 --max-time 20 "$BIR_PRODUCTION_HEALTH_URL" -o /tmp/v293-health.json
          node -e "const h=require('/tmp/v293-health.json'); if(!h.ok||!h.data||h.data.database!=='online') process.exit(2); console.log('Production health',h.data.version,h.data.database)"
      - name: Read-only D1 coherence snapshot
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -u
          runq(){ name="$1"; sql="$2"; echo "===== $name =====" | tee "/tmp/$name.txt"; if ! npx wrangler d1 execute blue-magic --remote --config wrangler.production.jsonc --command "$sql" 2>&1 | tee -a "/tmp/$name.txt"; then echo "QUERY_FAILED_BUT_DIAGNOSTIC_CONTINUES" | tee -a "/tmp/$name.txt"; fi; }
          MATCH="(UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' OR UPPER(node_code) LIKE 'POS1%')"
          runq v293-schema-offline "PRAGMA table_info(offline_events)"
          runq v293-schema-devices "PRAGMA table_info(devices)"
          runq v293-schema-commands "PRAGMA table_info(commands)"
          runq v293-schema-account-balances "PRAGMA table_info(account_balances)"
          runq v293-schema-operator-messages "PRAGMA table_info(operator_messages)"
          runq v293-identity-candidates "SELECT node_code,role,parent_node_code,default_commission_bps,active FROM nodes WHERE $MATCH ORDER BY role,node_code LIMIT 120"
          runq v293-devices "SELECT device_id,node_code,mode,active,robot_enabled,sim_verified,sim_slot,offline_pending_events,accessibility_enabled,accessibility_connected,battery_percent,last_seen_at,last_telemetry_at FROM devices WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' OR UPPER(node_code) LIKE 'POS1%' ORDER BY node_code,active DESC,robot_enabled DESC,last_seen_at DESC LIMIT 160"
          runq v293-command-summary "SELECT executor_node_code,state,COUNT(*) AS qty,MIN(created_at) AS oldest,MAX(updated_at) AS newest FROM commands WHERE (UPPER(executor_node_code) LIKE '%DSM1%' OR UPPER(executor_node_code) LIKE '%SU1%' OR UPPER(executor_node_code) LIKE 'POS1%') AND state NOT IN ('SUCCEEDED','FAILED','UNKNOWN','BLOCKED','CANCELLED') GROUP BY executor_node_code,state ORDER BY executor_node_code,state"
          runq v293-commands "SELECT id,public_id,requester_node_code,executor_node_code,target_node_code,operation,command_kind,amount,state,attempt,max_attempts,leased_until,created_at,started_at,completed_at,updated_at,substr(COALESCE(result_message,''),1,240) AS result_message FROM commands WHERE UPPER(executor_node_code) LIKE '%DSM1%' OR UPPER(requester_node_code) LIKE '%DSM1%' OR UPPER(target_node_code) LIKE '%DSM1%' OR UPPER(executor_node_code) LIKE '%SU1%' OR UPPER(requester_node_code) LIKE '%SU1%' OR UPPER(target_node_code) LIKE '%SU1%' ORDER BY id DESC LIMIT 180"
          runq v293-command-events "SELECT e.id,c.public_id,c.executor_node_code,e.state,substr(COALESCE(e.message,''),1,240) AS message,e.created_at FROM command_events e JOIN commands c ON c.id=e.command_id WHERE UPPER(c.executor_node_code) LIKE '%DSM1%' OR UPPER(c.executor_node_code) LIKE '%SU1%' ORDER BY e.id DESC LIMIT 220"
          runq v293-wakes "SELECT id,node_code,requested_by_device_id,reason,state,created_at,consumed_by_device_id,consumed_at FROM sync_wake_requests WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' ORDER BY id DESC LIMIT 120"
          runq v293-offline-summary "SELECT source_node_code,received_via,kind,COUNT(*) AS qty,MAX(received_at) AS latest FROM offline_events WHERE UPPER(source_node_code) LIKE '%DSM1%' OR UPPER(source_node_code) LIKE '%SU1%' GROUP BY source_node_code,received_via,kind ORDER BY source_node_code,latest DESC"
          runq v293-offline-events "SELECT event_id,source_device_id,source_node_code,command_public_id,kind,source_created_at,received_via,relay_fingerprint_sha256,relay_hops,received_at FROM offline_events WHERE UPPER(source_node_code) LIKE '%DSM1%' OR UPPER(source_node_code) LIKE '%SU1%' ORDER BY received_at DESC LIMIT 140"
          runq v293-balances "SELECT node_code,balance,source,evidence_kind,confidence,evidence_priority,balance_quality,source_command_public_id,evidence_command_public_id,operator_event_at,observed_at,valid_until,last_transaction_id,updated_at FROM account_balances WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' ORDER BY node_code"
          runq v293-balance-evidence "SELECT id,node_code,command_public_id,balance,evidence_kind,evidence_priority,balance_quality,operator_event_at,transaction_id,accepted,decision_reason,created_at FROM balance_evidence_log WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' ORDER BY id DESC LIMIT 140"
          runq v293-operator-messages "SELECT id,node_code,command_public_id,message_kind,status,transaction_id,receipt_number,amount,current_balance,transaction_date,transaction_time,debit_credit,charge_amount,commission_amount,tax_amount,created_at FROM operator_messages WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' ORDER BY id DESC LIMIT 180"
          runq v293-activity "SELECT * FROM node_activity_state WHERE UPPER(node_code) LIKE '%DSM1%' OR UPPER(node_code) LIKE '%SU1%' ORDER BY node_code"
          runq v293-accounting-tables "SELECT name,sql FROM sqlite_master WHERE type='table' AND (name LIKE '%account%' OR name LIKE '%ledger%' OR name LIKE '%commission%' OR name LIKE '%transaction%') ORDER BY name"
          runq v293-accounting-command-check "SELECT executor_node_code,COUNT(*) AS success_count,COALESCE(SUM(amount),0) AS success_amount,COALESCE(SUM(commission_amount),0) AS commission_sum FROM commands WHERE (UPPER(executor_node_code) LIKE '%DSM1%' OR UPPER(executor_node_code) LIKE '%SU1%') AND state='SUCCEEDED' GROUP BY executor_node_code"
      - name: Upload read-only diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.3-field-coherence-diagnostic
          path: |
            /tmp/v293-*.txt
            /tmp/v293-health.json
            /tmp/v293-dryrun.txt
          if-no-files-found: error
          retention-days: 30
