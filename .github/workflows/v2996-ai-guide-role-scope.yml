name: BIR v2.9.9.6 AI Guide + Role Scope Qualification

on:
  push:
    branches: [feat/bir-v2-9-9-6-ai-guide-harmonization]
    paths:
      - 'app/**'
      - 'docs/BIR_2.9.9.6_AI_GUIDE_HARMONIZATION.md'
      - '.github/workflows/v2996-ai-guide-role-scope.yml'
  pull_request:
    branches: [fix/bir-v2-9-9-3-android11-child-warroom-tchoronko]
    paths:
      - 'app/**'
      - '.github/workflows/v2996-ai-guide-role-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bir-v2996-ai-role-${{ github.ref }}
  cancel-in-progress: true

env:
  BIR_V2993_BASE_SHA: e27a0ead275b44be880461a9be548bb3c9c5a0c5

jobs:
  contracts-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove additive boundary and v2.9.9.6 identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_V2993_BASE_SHA" -- cloudflare
          grep -q 'versionCode 70' app/build.gradle
          grep -q 'versionName "2.9.9.6"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          grep -q 'ai-guide-v2996.js' app/src/main/assets/intelligence-v297.js
          grep -q 'ai-role-guard-v2996.js' app/src/main/assets/intelligence-v297.js
          ! grep -Eq "addScriptOnce\([^\n]+(transaction-first-v298|reference-stability-v299|field-runtime-v2991|field-runtime-v2992)" app/src/main/assets/intelligence-v297.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and non-regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            app/src/main/assets/intelligence-v297.js \
            app/src/main/assets/intelligence-v297-core.js \
            app/src/main/assets/field-runtime-v2993.js \
            app/src/main/assets/convergence-v2995.js \
            app/src/main/assets/ai-guide-v2996.js \
            app/src/main/assets/ai-role-guard-v2996.js; do
            node --check "$f"
          done
          cp app/build.gradle /tmp/build.gradle.v2996
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 70','versionCode 69').replace('versionName "2.9.9.6"','versionName "2.9.9.5"')
          p.write_text(s)
          PY
          node app/src/test/v2995-convergence-contract.mjs
          mv /tmp/build.gradle.v2996 app/build.gradle
          git diff --exit-code -- app/build.gradle
          node app/src/test/v2996-ai-guide-harmonization-contract.mjs
          bash -n app/src/test/v2996-webview-smoke.sh

      - name: Explicit PoS and hierarchy isolation assertions
        shell: bash
        run: |
          set -euo pipefail
          guard=app/src/main/assets/ai-role-guard-v2996.js
          grep -q "role()==='POS'" "$guard"
          grep -q 'Aide limitée au rôle PoS' "$guard"
          grep -q 'Fonctionnalités disponibles pour votre rôle PoS' "$guard"
          grep -q "if(r==='POS'){denyPos();return true;}" "$guard"
          grep -q "if(r==='DAE'&&t.type!=='DSM')" "$guard"
          grep -q "if(r==='DSM'&&t.type!=='POS')" "$guard"
          grep -q 'captureQuickAction' "$guard"
          grep -q 'BIRAIGuideV2996.__roleGuard' "$guard"
          ! grep -Eq 'createCommand\(|previewCommand\(|confirmCommand\(|dialUssd\(|rawUssd\(|setInterval\(|new MutationObserver\(' "$guard"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true

      - name: Build isolated qualification APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR v2.9.9.6 AI Role Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-v2996-AI-Role-Qualification.apk

      - name: Verify qualification APK metadata
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-v2996-AI-Role-Qualification.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/aapt" dump badging "$apk" | tee /tmp/v2996-role-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='70' versionName='2.9.9.6'" /tmp/v2996-role-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v2996-role-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v2996-role-badging.txt
          ! grep -q 'application-debuggable' /tmp/v2996-role-badging.txt
          sha256sum "$apk" | tee /tmp/v2996-role-qualification.sha256
          git rev-parse HEAD | tee /tmp/v2996-role-source-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2996-AI-Role-Qualification
          retention-days: 7
          if-no-files-found: error
          path: |
            BIR-v2996-AI-Role-Qualification.apk
            /tmp/v2996-role-badging.txt
            /tmp/v2996-role-qualification.sha256
            /tmp/v2996-role-source-sha.txt

  qualification-summary:
    needs: [contracts-build]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo 'B.I.R. v2.9.9.6 AI role-scope candidate passed syntax, v2995/v2996 contracts, hierarchy isolation and an isolated release build.'
          echo 'Historical v2993/v2994 exact-version contracts remain covered by their own release lines; this workflow does not falsify their version identity.'
          echo 'Full permanent-signer Android 6/11/16 qualification is handled by the companion v2996 qualification workflow.'
          echo 'No Cloudflare/D1 mutation or production deployment is performed.'
