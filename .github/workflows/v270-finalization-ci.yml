name: BIR v2.7 Finalization CI

on:
  push:
    branches: [feat/bir-v2-7-finalization]
    paths: [.github/authorized-v270-ci.trigger]

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: feat/bir-v2-7-finalization
          fetch-depth: 0

      - name: Prove lineage and forbidden server scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e3f9e9016e86c1193ba4170e2a9fce1ba466eb86 HEAD
          if ! git diff --quiet e3f9e9016e86c1193ba4170e2a9fce1ba466eb86...HEAD -- cloudflare; then
            echo '::error::Cloudflare/D1 source changed in the APK-only v2.7 line.'
            git diff e3f9e9016e86c1193ba4170e2a9fce1ba466eb86...HEAD -- cloudflare
            exit 1
          fi
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'versionCode 51' app/build.gradle
          grep -q 'versionName "2.7.0"' app/build.gradle
          grep -q 'payload.put("app_version", "2.7.0")' app/src/main/java/com/profitloop/blueauto/ApiClient.java

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Worker tests without deployment
        working-directory: cloudflare
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node --check src/index.js

      - name: Historical Blue Magic and BIR contracts
        run: |
          set -euo pipefail
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          node app/src/test/v2610-control-tower.mjs
          node app/src/test/v2611-finalization-contract.mjs
          node app/src/test/v2611-shell-contract.mjs
          node app/src/test/v270-finalization-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
          node --check app/src/main/assets/control-tower-v2611.js
          node --check app/src/main/assets/control-tower-v270.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Prepare unmistakably ephemeral validation signature
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -v \
            -keystore .pilot-signing/debug.keystore \
            -storepass "$password" \
            -keypass "$password" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=BIR v2.7 CI EPHEMERAL,O=ProfitLoop,C=CM" >/dev/null 2>&1
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Android unit tests and real Release assembly
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK identity, alignment and signature
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -qi 'Verified using v1 scheme.*true' /tmp/apksigner.txt
          grep -qi 'Verified using v2 scheme.*true' /tmp/apksigner.txt
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='51' versionName='2.7.0'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          if grep -q 'application-debuggable' /tmp/badging.txt; then
            echo '::error::Release is debuggable.'
            exit 1
          fi
          permanent='f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5'
          ci_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -1)"
          if [ "$ci_cert" = "$permanent" ]; then
            echo '::error::Permanent certificate unexpectedly used in validation CI.'
            exit 1
          fi
          sha256sum "$apk" | tee /tmp/v270-validation.sha256
          cp "$apk" BIR-Blue-Infinity-Retail-v2.7.0-Validation-Ephemeral.apk

      - name: Upload validation APK only
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.7.0-validation-ephemeral
          path: BIR-Blue-Infinity-Retail-v2.7.0-Validation-Ephemeral.apk
          if-no-files-found: error
          retention-days: 14

  smoke-android:
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 26, 30]
    steps:
      - name: Download exact validation APK
        uses: actions/download-artifact@v4
        with:
          name: BIR-v2.7.0-validation-ephemeral
          path: apk

      - name: Boot and launch BIR on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r apk/BIR-Blue-Infinity-Retail-v2.7.0-Validation-Ephemeral.apk
            adb shell monkey -p com.profitloop.blueauto -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -q 'com.profitloop.blueauto'
            if adb logcat -d '*:E' | grep -E 'FATAL EXCEPTION|Process: com.profitloop.blueauto' | grep -q 'com.profitloop.blueauto'; then
              echo '::error::BIR fatal exception detected after launch.'
              exit 1
            fi
            echo "Android API ${{ matrix.api-level }} clean install and launch OK"
