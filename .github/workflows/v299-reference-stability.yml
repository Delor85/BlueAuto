name: BIR v2.9.9 Reference Stability Historical Qualification

on:
  push:
    branches: [fix/bir-v2-9-9-reference-stability]
  pull_request:
    branches: [fix/bir-v2-9-9-reference-stability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-reference-stability:
    if: github.ref == 'refs/heads/fix/bir-v2-9-9-reference-stability' || github.base_ref == 'fix/bir-v2-9-9-reference-stability'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical v2.9.9 reference layer only
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/transaction-first-v298.js
          node --check app/src/main/assets/reference-stability-v299.js
          test -s app/src/main/assets/transaction-first-v298.css
          test -s app/src/main/assets/reference-stability-v299.css
          echo 'Historical B.I.R. v2.9.9 reference-stability workflow is scoped to its own line.'
