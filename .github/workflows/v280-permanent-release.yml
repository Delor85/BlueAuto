name: BIR v2.8 Permanent Release

on:
  push:
    branches: [feat/bir-v2-8-operations-admin]
    paths: [.github/authorized-v280-permanent.trigger]

permissions:
  contents: read

concurrency:
  group: bir-v280-permanent-release
  cancel-in-progress: false

jobs:
  permanent-release:
    if: "${{ github.event.head_commit.message == 'release: authorized BIR v2.8 permanent APK' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout authorization commit with full history
        uses: actions/checkout@v5
        with:
          ref: feat/bir-v2-8-operations-admin
          fetch-depth: 0

      - name: Resolve exact authorized application SHA and permanent certificate
        id: authorized
        run: |
          set -euo pipefail
          authorized_sha="$(sed -n 's/^authorized_sha=//p' .github/authorized-v280-permanent.trigger | head -1 | tr -d '\r\n')"
          expected_cert="$(sed -n 's/^certificate_sha256=//p' .github/authorized-v280-permanent.trigger | head -1 | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
          test "$authorized_sha" = '4c24ded4e2053aa30640f654ddaf5ddf55908c20'
          test "$expected_cert" = 'f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5'
          grep -q '^package=com.profitloop.blueauto$' .github/authorized-v280-permanent.trigger
          grep -q '^versionCode=53$' .github/authorized-v280-permanent.trigger
          grep -q '^versionName=2.8.0$' .github/authorized-v280-permanent.trigger
          grep -q '^production_v280_validated=31974344187$' .github/authorized-v280-permanent.trigger
          grep -q '^pr4_merge=forbidden$' .github/authorized-v280-permanent.trigger
          git cat-file -e "$authorized_sha^{commit}"
          git merge-base --is-ancestor "$authorized_sha" HEAD
          echo "sha=$authorized_sha" >> "$GITHUB_OUTPUT"
          echo "cert=$expected_cert" >> "$GITHUB_OUTPUT"

      - name: Prove production v2.8 is live before permanent signing
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 'https://blue-magic-api.mbolodelorpro.workers.dev/api?action=health&release=apk-v280')"
          printf '%s\n' "$health"
          printf '%s\n' "$health" | grep -q '"version":"2.8.0-cloudflare"'
          printf '%s\n' "$health" | grep -q '"database":"online"'
          printf '%s\n' "$health" | grep -q '"owner_admin":true'
          printf '%s\n' "$health" | grep -q '"owner_mock_entitlement":true'
          printf '%s\n' "$health" | grep -q '"accounting":true'
          printf '%s\n' "$health" | grep -q '"commissions":true'
          printf '%s\n' "$health" | grep -q '"tchoronko":true'

      - name: Prove PR 4 remains open and non-merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/Delor85/BlueAuto/pulls/4')"
          printf '%s\n' "$json" | jq -e '.state == "open" and .merged == false' >/dev/null

      - name: Checkout exact authorized application source
        run: |
          set -euo pipefail
          git checkout --detach '${{ steps.authorized.outputs.sha }}'
          test "$(git rev-parse HEAD)" = '${{ steps.authorized.outputs.sha }}'
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          grep -q 'versionCode 53' app/build.gradle
          grep -q 'versionName "2.8.0"' app/build.gradle
          grep -q 'android:icon="@drawable/ic_launcher_bir"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher_bir"' app/src/main/AndroidManifest.xml
          grep -q 'OWNER_ADMIN' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          grep -q 'MOCK_OWNER' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          if grep -q 'MOCK_OWNER_NODE_CODE = "SU1"' app/src/main/java/com/profitloop/blueauto/MainActivity.java; then
            echo '::error::Obsolete SU1-dependent MOCK detected.'
            exit 1
          fi

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run inherited and v2.8 application contracts
        run: |
          set -euo pipefail
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          node app/src/test/v2610-control-tower.mjs
          node app/src/test/v2611-finalization-contract.mjs
          node app/src/test/v2611-shell-contract.mjs
          node app/src/test/v270-finalization-contract.mjs
          node app/src/test/v270-owner-mock-contract.mjs
          node app/src/test/v271-field-stabilization-contract.mjs
          node app/src/test/v280-operations-admin-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
          node --check app/src/main/assets/control-tower-v271.js
          node --check app/src/main/assets/balance-engine-v280.js
          node --check app/src/main/assets/control-tower-v280.js
          python3 .github/scripts/v280_schema_smoke.py

      - name: Validate Worker source without deployment
        working-directory: cloudflare
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node --check src/index.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true

      - name: Load and prove historical permanent signing certificate
        env:
          PERMANENT_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          PERMANENT_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PERMANENT_KEYSTORE_BASE64"
          test -n "$PERMANENT_KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$PERMANENT_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          password="$(printf '%s' "$PERMANENT_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$password"
          actual="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual" = '${{ steps.authorized.outputs.cert }}'
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build exact-source Release
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Re-align and explicitly sign V1 V2 V3 with historical key
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          source_apk=app/build/outputs/apk/release/app-release.apk
          aligned=BIR-v2.8.0-aligned.apk
          final=BIR-Blue-Infinity-Retail-v2.8.0-vc53-Permanent.apk
          "$build_tools/zipalign" -f -p 4 "$source_apk" "$aligned"
          "$build_tools/apksigner" sign \
            --ks .pilot-signing/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass "pass:$BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD" \
            --key-pass "pass:$BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$final" "$aligned"
          "$build_tools/zipalign" -c -v 4 "$final"

      - name: Verify permanent APK identity, icon and signature
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-Blue-Infinity-Retail-v2.8.0-vc53-Permanent.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/v280-permanent-signature.txt
          grep -qi 'Verified using v1 scheme.*true' /tmp/v280-permanent-signature.txt
          grep -qi 'Verified using v2 scheme.*true' /tmp/v280-permanent-signature.txt
          grep -qi 'Verified using v3 scheme.*true' /tmp/v280-permanent-signature.txt
          actual_cert="$(sed -n -E 's/^(Signer #1|V[23] Signer): certificate SHA-256 digest: //p' /tmp/v280-permanent-signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -1)"
          if [ -z "$actual_cert" ]; then
            actual_cert="$(grep -i 'certificate SHA-256 digest:' /tmp/v280-permanent-signature.txt | head -1 | sed -E 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          fi
          test "$actual_cert" = '${{ steps.authorized.outputs.cert }}'
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/v280-permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='53' versionName='2.8.0'" /tmp/v280-permanent-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v280-permanent-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v280-permanent-badging.txt
          grep -q 'application-icon' /tmp/v280-permanent-badging.txt
          grep -q "launchable-activity: name='com.profitloop.blueauto.MainActivity'" /tmp/v280-permanent-badging.txt
          if grep -q 'application-debuggable' /tmp/v280-permanent-badging.txt; then
            echo '::error::Permanent APK is debuggable.'
            exit 1
          fi
          sha256sum "$apk" | tee BIR-v2.8.0-Permanent.sha256.txt
          {
            echo "source_sha=${{ steps.authorized.outputs.sha }}"
            echo 'package=com.profitloop.blueauto'
            echo 'versionName=2.8.0'
            echo 'versionCode=53'
            echo "certificate_sha256=${{ steps.authorized.outputs.cert }}"
            echo 'signature_v1=true'
            echo 'signature_v2=true'
            echo 'signature_v3=true'
            echo 'production_worker=2.8.0-cloudflare'
            echo 'd1_0005=applied'
            echo 'd1_0006=applied'
            echo 'production_validation_run=31974344187'
            echo 'pr4_merged=false'
          } > BIR-v2.8.0-Permanent-release-info.txt

      - name: Publish permanent APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.8.0-Permanent
          path: |
            BIR-Blue-Infinity-Retail-v2.8.0-vc53-Permanent.apk
            BIR-v2.8.0-Permanent.sha256.txt
            BIR-v2.8.0-Permanent-release-info.txt
          if-no-files-found: error
          retention-days: 90
