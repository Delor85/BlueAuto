name: Blue Magic v2.6.7 Camtel scale validation

on:
  push:
    branches:
      - fix/blue-magic-v2-6-recovery
    paths:
      - .github/workflows/v267-camtel-scale-validation.yml
      - .github/v267-camtel-scale-validation.trigger

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0

      - name: Update nocturnal Android contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/test/finance-flow.mjs')
          t=p.read_text(encoding='utf-8')
          old="""assert.match(robotServiceV267, /startHour = 2/);\nassert.match(robotServiceV267, /startHour = 3/);\nassert.match(robotServiceV267, /startHour = 4/);\n"""
          new="""assert.match(robotServiceV267, /startMinute = 2 \\* 60/);\nassert.match(robotServiceV267, /startMinute = 3 \\* 60/);\nassert.match(robotServiceV267, /startMinute = 4 \\* 60/);\nassert.match(robotServiceV267, /deterministicNightSlot/);\nassert.match(robotServiceV267, /5 \\* 60 \\+ 15/);\nassert.match(robotServiceV267, /result\\.optBoolean\\(\"complete\", false\\)/);\nassert.match(robotServiceV267, /5 \\* 60_000L/);\n"""
          if old not in t:
              raise SystemExit('old nocturnal contract missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY

      - name: Verify immutable production scope
        run: |
          test ! -e cloudflare/migrations/0005_blue_message_intelligence_and_modules.sql
          git diff --exit-code d2242b69d8eaec4fbedfad0323ad18525093f671 HEAD -- cloudflare/migrations/0004_blue_message_intelligence_and_modules.sql
          git diff --exit-code d2242b69d8eaec4fbedfad0323ad18525093f671 HEAD -- .github/workflows/deploy-cloudflare.yml

      - name: Install Worker packages
        working-directory: cloudflare
        run: npm ci

      - name: Run Worker and D1 tests
        working-directory: cloudflare
        run: npm run check

      - name: Run Android Web contract tests
        run: node app/src/test/finance-flow.mjs

      - name: Verify canonical Camtel scale sources
        run: |
          grep -q 'CamtelUssdCatalog' app/src/main/java/com/profitloop/blueauto/UssdCommandFactory.java
          grep -q 'deterministicNightSlot' app/src/main/java/com/profitloop/blueauto/RobotService.java
          grep -q 'canonicalParent' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          grep -q "POS37_DSM12_CE04" cloudflare/test/integration.mjs
          grep -q "REPORT_BALANCE_EVIDENCE_TTL_SECONDS = 14 \* 3600" cloudflare/src/index.js
          grep -q "AUDIT_MAX_OUTSTANDING = 12" cloudflare/src/index.js

      - name: Commit updated validation contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/finance-flow.mjs
          git diff --cached --quiet && { echo 'No contract change produced'; exit 1; }
          git commit -m 'test: lock Camtel scale audit contract'
          git push origin HEAD:fix/blue-magic-v2-6-recovery
