name: Blue Magic v2.6.8 compile fix

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-compile-fix.yml]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Apply compile-only fix
        run: python3 .github/scripts/v268_compile_fix.py
      - name: Validate Worker and Android
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          mkdir -p .pilot-signing
          openssl rand -hex 32 > .pilot-signing/keystore.password
          pilot_password="$(tr -d '\r\n' < .pilot-signing/keystore.password)"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$pilot_password" -alias androiddebugkey -keypass "$pilot_password" -dname "CN=Blue Magic CI,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$pilot_password" >> "$GITHUB_ENV"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Commit validated compile fix
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add -A app/src/main/java/com/profitloop/blueauto app/src/test/java/com/profitloop/blueauto/CommandExecutionPolicyTest.java
          git diff --cached --check
          git commit -m "fix: compile responsive management in v2.6.8"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Development/test only. No Cloudflare deployment, no D1 migration, no permanent APK publication.
