name: BIR v2.9.9 Permanent Delivery

on:
  push:
    branches: [ci/bir-v299-permanent-delivery]
    paths: [.github/authorized-v299-permanent.trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: bir-v299-permanent-delivery
  cancel-in-progress: false

env:
  BIR_SOURCE_SHA: a13bafc76aa23157bb409a72904f4bc64f5cf815
  BIR_BASELINE_SHA: 9c0832fa0d2a1d1a946d4350e03933098451d59d
  BIR_VALIDATION_RUN_ID: '32671963300'
  BIR_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  authorization-gate:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove isolated permanent-delivery authorization
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          trigger=.github/authorized-v299-permanent.trigger
          test -f "$trigger"
          source_sha="$(sed -n 's/^authorized_sha=//p' "$trigger" | head -1 | tr -d '\r\n')"
          run_id="$(sed -n 's/^validation_run_id=//p' "$trigger" | head -1 | tr -d '\r\n')"
          test "$source_sha" = "$BIR_SOURCE_SHA"
          test "$run_id" = "$BIR_VALIDATION_RUN_ID"
          git cat-file -e "$source_sha^{commit}"
          grep -q '^package=com.profitloop.blueauto$' "$trigger"
          grep -q '^versionName=2.9.9$' "$trigger"
          grep -q '^versionCode=64$' "$trigger"
          grep -q '^certificate_sha256=f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5$' "$trigger"
          grep -q '^production_mutation=false$' "$trigger"
          unexpected="$(git diff --name-only "$source_sha"..HEAD | grep -Ev '^\.github/(workflows/v299-permanent-delivery\.yml|authorized-v299-permanent\.trigger)$' || true)"
          test -z "$unexpected"
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.conclusion')"
          test "$conclusion" = success
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  permanent-build:
    needs: authorization-gate
    if: ${{ needs.authorization-gate.outputs.authorized == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: production
    outputs:
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
      source_sha: ${{ needs.authorization-gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorization-gate.outputs.source_sha }}
          fetch-depth: 0
      - name: Re-prove exact source and no production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIR_SOURCE_SHA"
          git diff --exit-code "$BIR_BASELINE_SHA" -- cloudflare
          grep -q 'versionCode 64' app/build.gradle
          grep -q 'versionName "2.9.9"' app/build.gradle
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run all source contracts
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)
          for test_file in app/src/test/*.mjs; do node "$test_file"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/field-ops-v297.js
          node --check app/src/main/assets/intelligence-v297.js
          node --check app/src/main/assets/transaction-first-v298.js
          node --check app/src/main/assets/reference-stability-v299.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Load and prove historical permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$password"
          actual="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual" = "$BIR_CERT_SHA256"
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Download exact green validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/validated
          gh run download "$BIR_VALIDATION_RUN_ID" -n BIR-v2.9.9-reference-stability-EPHEMERAL -D /tmp/validated
          validated="$(find /tmp/validated -type f -name 'app-release.apk' -print -quit)"
          test -f "$validated"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt" dump badging "$validated" | grep -q "package: name='com.profitloop.blueauto' versionCode='64' versionName='2.9.9'"
          cp "$validated" /tmp/v299-green-validation.apk
      - name: Build candidate and v2.9.8 baseline with historical key
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk /tmp/v299-permanent-build.apk
          git worktree add /tmp/bir-v298 "$BIR_BASELINE_SHA"
          mkdir -p /tmp/bir-v298/.pilot-signing
          cp .pilot-signing/debug.keystore /tmp/bir-v298/.pilot-signing/debug.keystore
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD" gradle --no-daemon -p /tmp/bir-v298 :app:assembleRelease
      - name: Align and explicitly sign baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          sign_one() {
            src="$1"; aligned="$2"; out="$3"
            "$bt/zipalign" -f -p 4 "$src" "$aligned"
            "$bt/apksigner" sign --ks .pilot-signing/debug.keystore --ks-key-alias androiddebugkey \
              --ks-pass "pass:$BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD" --key-pass "pass:$BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$out" "$aligned"
          }
          sign_one /tmp/bir-v298/app/build/outputs/apk/release/app-release.apk /tmp/v298-aligned.apk BIR-v2.9.8-vc63-Permanent-Baseline.apk
          sign_one /tmp/v299-permanent-build.apk /tmp/v299-aligned.apk BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk
      - name: Verify certificate, signatures, identity and exact application payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in BIR-v2.9.8-vc63-Permanent-Baseline.apk BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk; do
            "$bt/zipalign" -c -v 4 "$apk" >/dev/null
            "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "/tmp/$apk.signature.txt"
            actual="$(grep -i 'certificate SHA-256 digest:' "/tmp/$apk.signature.txt" | head -1 | sed -E 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$actual" = "$BIR_CERT_SHA256"
            grep -qi 'Verified using v1 scheme.*true' "/tmp/$apk.signature.txt"
            grep -qi 'Verified using v2 scheme.*true' "/tmp/$apk.signature.txt"
            grep -qi 'Verified using v3 scheme.*true' "/tmp/$apk.signature.txt"
            ! grep -q 'Signer #2' "/tmp/$apk.signature.txt"
          done
          "$bt/aapt" dump badging BIR-v2.9.8-vc63-Permanent-Baseline.apk | grep -q "package: name='com.profitloop.blueauto' versionCode='63' versionName='2.9.8'"
          "$bt/aapt" dump badging BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk | tee /tmp/v299-permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='64' versionName='2.9.9'" /tmp/v299-permanent-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v299-permanent-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v299-permanent-badging.txt
          grep -q "application-label:'B.I.R. — Blue Infinity Retail'" /tmp/v299-permanent-badging.txt
          ! grep -q 'application-debuggable' /tmp/v299-permanent-badging.txt
          python3 - <<'PY'
          import zipfile, hashlib
          validation='/tmp/v299-green-validation.apk'
          permanent='BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk'
          def entries(path):
              out={}
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      u=n.upper()
                      if u.startswith('META-INF/') and (u.endswith('.SF') or u.endswith('.RSA') or u.endswith('.DSA') or u.endswith('MANIFEST.MF')):
                          continue
                      out[n]=hashlib.sha256(z.read(n)).hexdigest()
              return out
          a,b=entries(validation),entries(permanent)
          assert a==b, 'application ZIP payload differs from exact green validation artifact'
          print('Application payload identical to green validation artifact:',len(a),'entries')
          PY
          apk_sha="$(sha256sum BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk | awk '{print $1}')"
          validation_sha="$(sha256sum /tmp/v299-green-validation.apk | awk '{print $1}')"
          printf '%s  %s\n' "$apk_sha" BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk > BIR-v2.9.9-Permanent.sha256.txt
          {
            echo "source_sha=$BIR_SOURCE_SHA"
            echo "validation_run_id=$BIR_VALIDATION_RUN_ID"
            echo "validation_apk_sha256=$validation_sha"
            echo 'package=com.profitloop.blueauto'
            echo 'versionName=2.9.9'
            echo 'versionCode=64'
            echo 'minSdk=23'
            echo 'targetSdk=34'
            echo "apk_sha256=$apk_sha"
            echo "certificate_sha256=$BIR_CERT_SHA256"
            echo 'signatures=v1,v2,v3'
            echo 'signers=1'
            echo 'upgrade_baseline=2.9.8-vc63'
            echo 'payload_identical_to_green_validation=true'
            echo 'production_mutation=false'
          } > BIR-v2.9.9-Permanent-release-info.txt
          echo "apk_sha256=$apk_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9-Permanent
          retention-days: 90
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk
            BIR-v2.9.8-vc63-Permanent-Baseline.apk
            BIR-v2.9.9-Permanent.sha256.txt
            BIR-v2.9.9-Permanent-release-info.txt
            /tmp/v299-permanent-badging.txt

  smoke-upgrade:
    needs: permanent-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { android: '6', api: 23, arch: x86, profile: 'Nexus 5' }
          - { android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X' }
          - { android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X' }
    name: Permanent upgrade Android ${{ matrix.android }} / API ${{ matrix.api }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9-Permanent
          path: apk
      - name: Prove in-place v2.9.8 to v2.9.9 update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -eu
            adb wait-for-device
            adb install --no-streaming apk/BIR-v2.9.8-vc63-Permanent-Baseline.apk
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=63'
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity
            adb shell am force-stop com.profitloop.blueauto
            adb install -r --no-streaming apk/BIR-Blue-Infinity-Retail-v2.9.9-vc64-Permanent.apk
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=64'
            adb logcat -c || true
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -q 'com.profitloop.blueauto'
            adb logcat -d '*:E' > /tmp/v299-permanent-logcat.txt || true
            ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto' /tmp/v299-permanent-logcat.txt
