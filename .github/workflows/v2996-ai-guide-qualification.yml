name: BIR v2.9.9.6 AI Guide Qualification

on:
  push:
    branches: [feat/bir-v2-9-9-6-ai-guide-harmonization]

permissions:
  contents: read

concurrency:
  group: bir-v2996-ai-guide-qualification
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v2.9.9.6 scope and non-regression contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 70' app/build.gradle
          grep -q 'versionName "2.9.9.6"' app/build.gradle
          test -z "$(git diff --name-only e27a0ead275b44be880461a9be548bb3c9c5a0c5..HEAD | grep '^cloudflare/' || true)"
          node --check app/src/main/assets/ai-guide-v2996.js
          node --check app/src/main/assets/ai-role-guard-v2996.js
          node --check app/src/main/assets/intelligence-v297.js
          cp app/build.gradle /tmp/build.gradle.v2996
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 70','versionCode 69').replace('versionName "2.9.9.6"','versionName "2.9.9.5"')
          p.write_text(s)
          PY
          node app/src/test/v2995-convergence-contract.mjs
          mv /tmp/build.gradle.v2996 app/build.gradle
          git diff --exit-code -- app/build.gradle
          node app/src/test/v2996-ai-guide-harmonization-contract.mjs
          bash -n app/src/test/v2996-webview-smoke.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Create isolated qualification key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR v2.9.9.6 Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Unit tests and qualification release build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.6-vc70-Qualification.apk
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs BIR-Blue-Infinity-Retail-v2.9.9.6-vc70-Qualification.apk | tee signature.txt
          "$bt/aapt" dump badging BIR-Blue-Infinity-Retail-v2.9.9.6-vc70-Qualification.apk | tee badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='70' versionName='2.9.9.6'" badging.txt
          grep -q "sdkVersion:'23'" badging.txt
          grep -q "targetSdkVersion:'34'" badging.txt
          ! grep -q 'application-debuggable' badging.txt
          sha256sum BIR-Blue-Infinity-Retail-v2.9.9.6-vc70-Qualification.apk | tee BIR-v2.9.9.6-Qualification.sha256.txt
          git rev-parse HEAD | tee BIR-v2.9.9.6-Qualification-source.txt
          printf '%s\n' 'qualification_signer=ephemeral_non_production' 'permanent_signer_required_for_delivery=true' > BIR-v2.9.9.6-Qualification-signing-scope.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.6-Qualification
          retention-days: 90
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.6-vc70-Qualification.apk
            BIR-v2.9.9.6-Qualification.sha256.txt
            BIR-v2.9.9.6-Qualification-source.txt
            BIR-v2.9.9.6-Qualification-signing-scope.txt
            badging.txt
            signature.txt

  android-smoke:
    needs: contract-and-build
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {android: '6', api: 23, arch: x86, profile: 'Nexus 5', stress: 8}
          - {android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X', stress: 24}
          - {android: '16', api: 36, arch: x86_64, profile: 'Nexus 5X', stress: 8}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.6-Qualification
          path: apk
      - name: Android ${{ matrix.android }} render/lifecycle smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash "$GITHUB_WORKSPACE/app/src/test/v2996-webview-smoke.sh" ${{ matrix.stress }}

  qualification-summary:
    needs: [contract-and-build, android-smoke]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo 'B.I.R. 2.9.9.6/vc70 qualification passed: contracts + isolated release build + Android 6/11/16 smoke.'
          echo 'The qualification APK is intentionally NOT signed with the production certificate.'
          echo 'Permanent signing remains a separate protected delivery action and is not required to validate UI/role behavior.'
          echo 'No Cloudflare/D1 mutation in this workflow.'
