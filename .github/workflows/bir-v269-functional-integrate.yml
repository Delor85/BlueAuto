name: BIR v2.6.9 Functional Integration

on:
  push:
    branches: [feat/bir-v2-6-9-functional]
    paths:
      - '.github/scripts/bir_v269_functional_patch.py'
      - '.github/scripts/bir_v269_post_patch.py'
      - '.github/workflows/bir-v269-functional-integrate.yml'
      - 'app/src/main/assets/bir-logo.svg'

permissions:
  contents: write

jobs:
  integrate-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/bir-v2-6-9-functional
          fetch-depth: 0

      - name: Apply BIR functional UX without touching engine logic
        run: |
          set -euo pipefail
          python3 .github/scripts/bir_v269_functional_patch.py
          python3 .github/scripts/bir_v269_post_patch.py
          git diff --check

      - name: Validate Cloudflare and full historical contracts
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Ephemeral validation signing
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          pilot_password="$(openssl rand -hex 32)"
          echo "::add-mask::$pilot_password"
          keytool -genkeypair \
            -keystore .pilot-signing/debug.keystore \
            -storepass "$pilot_password" \
            -alias androiddebugkey \
            -keypass "$pilot_password" \
            -dname "CN=BIR v2.6.9 CI Validation,O=ProfitLoop,C=CM" \
            -keyalg RSA -keysize 2048 -validity 30 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$pilot_password" >> "$GITHUB_ENV"

      - name: Android unit tests and real Release APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/bir-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='49' versionName='2.6.9'" /tmp/bir-badging.txt
          grep -q "sdkVersion:'23'" /tmp/bir-badging.txt
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          cp "$apk" BIR-Blue-Infinity-Retail-v2.6.9-Functional-Candidate.apk
          sha256sum BIR-Blue-Infinity-Retail-v2.6.9-Functional-Candidate.apk | tee /tmp/bir-v269.sha256

      - name: Upload functional candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.6.9-Functional-Candidate
          path: BIR-Blue-Infinity-Retail-v2.6.9-Functional-Candidate.apk
          if-no-files-found: error

      - name: Persist only validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Delor85'
          git config user.email 'mbolodelorpro@gmail.com'
          git add app/build.gradle \
                  app/src/main/res/values/strings.xml \
                  app/src/main/java/com/profitloop/blueauto/MainActivity.java \
                  app/src/main/assets/index.html \
                  app/src/main/assets/app.js \
                  app/src/main/assets/style.css \
                  app/src/main/assets/bir-logo.svg \
                  app/src/test/bir-v269-functional-contract.mjs
          if git diff --cached --quiet; then
            echo 'No application changes to commit.'
          else
            git commit -m 'feat: integrate BIR v2.6.9 over complete Blue Magic engine'
            git push origin HEAD:feat/bir-v2-6-9-functional
          fi
