name: Blue Magic v2.6.8 continuation validation

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-continue-validation.yml]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - name: Apply already-reviewed v2.6.8 follow-up
        run: |
          python3 .github/scripts/v268_followup_patch.py
          python3 .github/scripts/v268_followup_testfix.py
          python3 .github/scripts/v268_ui_testfix.py
          python3 .github/scripts/v268_responsive_manage_lock_patch.py
          python3 .github/scripts/v268_compat_test_patch.py
      - name: Validate complete historical and v2.6.8 contracts
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
      - name: Commit validated follow-up
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add app cloudflare/src/index.js cloudflare/test/integration.mjs
          git diff --cached --check
          git commit -m "fix: stabilize v2.6.8 finance robot and responsive management"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Development/test only. No Cloudflare deployment and no production migration.
