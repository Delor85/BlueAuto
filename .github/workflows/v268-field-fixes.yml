name: Blue Magic v2.6.8 field fixes implementation

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-field-fixes.yml]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - name: Repair integration fixture and apply bounded v2.6.8 field fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/test/integration.mjs')
          s=p.read_text()
          s=s.replace("if (token) headers.authorization = `Bearer ${token}`;", "if (token) headers['X-Device-Token'] = token;")
          p.write_text(s)
          PY
          python3 .github/scripts/v268_field_patch.py
      - name: Test Worker and Android web contracts
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
      - name: Commit field fixes only
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add app cloudflare/src/index.js cloudflare/test/integration.mjs
          git diff --cached --check
          git commit -m "feat: stabilize Robot balances and commissions for v2.6.8"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Test-only workflow. Migration 0005 is used only by Miniflare; production remains v2.6.7.
