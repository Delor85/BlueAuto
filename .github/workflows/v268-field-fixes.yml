name: Blue Magic v2.6.8 field fixes implementation

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-field-fixes.yml]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - name: Restore full integration suite, add 0005 to Miniflare and update lock contract
        run: |
          git show 2dc2f435c078cf1b8612261f8c9210bc48e54645:cloudflare/test/integration.mjs > cloudflare/test/integration.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/test/integration.mjs')
          s=p.read_text()
          old="'0003_balance_preflight_and_modules.sql', '0004_blue_message_intelligence_and_modules.sql']"
          new="'0003_balance_preflight_and_modules.sql', '0004_blue_message_intelligence_and_modules.sql',\n    '0005_commission_policies_and_financial_quotes.sql']"
          if old not in s: raise SystemExit('migration fixture anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('app/src/test/finance-flow.mjs')
          s=p.read_text()
          old="""assert.ok(service.indexOf('prepareSystemUssdSurface(needsWakeSettle)')
  < service.indexOf('SimCallManager.placeUssdCall(this, ussd, profileId)'));
assert.match(service, /SYSTEM_USSD_SCREEN_WAKE_MS = 45_000L/);
assert.match(service, /InsecureKeyguardDismissActivity\\.class/);
assert.doesNotMatch(service, /new Intent\\(this, MainActivity\\.class\\)[\\s\\S]{0,180}PREPARE_INSECURE_USSD/);
assert.doesNotMatch(service, /\"PIN_SUBMITTED\"\\.equals\\(state\\)\\) releaseCommandScreenWakeLock/);"""
          new="""assert.match(service, /DeviceLockState\\.blocksUssd\\(this\\)/);
assert.ok(service.indexOf('DeviceLockState.blocksUssd(this)')
  < service.indexOf('SimCallManager.placeUssdCall(this, ussd, profileId)'));
assert.doesNotMatch(service, /prepareSystemUssdSurface/);
assert.doesNotMatch(service, /SYSTEM_USSD_SCREEN_WAKE_MS/);
assert.doesNotMatch(service, /InsecureKeyguardDismissActivity/);
assert.doesNotMatch(service, /SCREEN_BRIGHT_WAKE_LOCK|ACQUIRE_CAUSES_WAKEUP|disableKeyguard/);"""
          if old not in s: raise SystemExit('legacy lock contract anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('assert.match(gradleConfig, /versionCode 47/);','assert.match(gradleConfig, /versionCode 48/);')
          s=s.replace('assert.match(gradleConfig, /versionName "2\\.6\\.7"/);','assert.match(gradleConfig, /versionName "2\\.6\\.8"/);')
          p.write_text(s)
          PY
          python3 .github/scripts/v268_field_patch.py
      - name: Test Worker and Android web contracts
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
      - name: Commit field fixes only
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add app cloudflare/src/index.js cloudflare/test/integration.mjs
          git diff --cached --check
          git commit -m "feat: stabilize Robot balances and commissions for v2.6.8"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Test-only workflow. Migration 0005 is used only by Miniflare; production remains v2.6.7.
