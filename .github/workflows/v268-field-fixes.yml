name: Blue Magic v2.6.8 field fixes implementation

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-field-fixes.yml]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - name: Apply v2.6.8 field follow-up
        run: |
          python3 .github/scripts/v268_followup_patch.py
          python3 .github/scripts/v268_followup_testfix.py
      - name: Test Worker and Android web contracts
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
      - name: Commit field follow-up only
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add app cloudflare/src/index.js cloudflare/test/integration.mjs
          git diff --cached --check
          git commit -m "fix: preserve queued finance and quote stock before confirmation"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Rerun after updating DSM→PoS commission expectations. Production remains v2.6.7; migration 0005 is not applied remotely.
