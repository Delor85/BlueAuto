name: Blue Magic v2.6.8 release hygiene

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-release-hygiene.yml]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/blue-magic-v2-6-recovery
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Apply source/documentation/release hygiene
        run: |
          python3 .github/scripts/v268_release_hygiene_patch.py
          python3 .github/scripts/v268_release_hygiene_compat.py
      - name: Validate full source and release guard
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
          mkdir -p .pilot-signing
          openssl rand -hex 32 > .pilot-signing/keystore.password
          p="$(tr -d '\r\n' < .pilot-signing/keystore.password)"
          export BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$p"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$p" -alias androiddebugkey -keypass "$p" -dname "CN=Blue Magic Hygiene CI,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 30 -noprompt
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Commit validated non-workflow hygiene files
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add README.md docs/PROJECT_STATE.md cloudflare/package.json cloudflare/package-lock.json app/src/test/v268-release-hygiene.mjs
          git diff --cached --check
          git commit -m "chore: align v2.6.8 docs and metadata"
          git push origin HEAD:fix/blue-magic-v2-6-recovery

# Development/test only. build.yml is validated here but persisted separately through the authorized GitHub file API.
# This workflow cannot deploy Worker/D1 or publish a permanent APK.
