name: Blue Magic v2.6.8 workflow lint

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-actionlint.yml]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate GitHub Actions syntax and expressions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -oneline .github/workflows/build.yml
