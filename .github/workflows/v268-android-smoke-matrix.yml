name: Blue Magic v2.6.8 Android smoke matrix

on:
  push:
    branches: [fix/blue-magic-v2-6-recovery]
    paths: [.github/workflows/v268-android-smoke-matrix.yml]

permissions:
  contents: read

jobs:
  build-matrix-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build v2.6.8 ephemeral Release
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          mkdir -p .pilot-signing
          openssl rand -hex 32 > .pilot-signing/keystore.password
          p="$(tr -d '\r\n' < .pilot-signing/keystore.password)"
          export BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$p"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$p" \
            -alias androiddebugkey -keypass "$p" -dname "CN=Matrix v268,O=Blue Magic,C=CM" \
            -keyalg RSA -keysize 2048 -validity 2 -noprompt
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='48' versionName='2.6.8'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          if grep -q application-debuggable /tmp/badging.txt; then
            echo "::error::Matrix APK must be non-debuggable"
            exit 1
          fi
          "$build_tools/zipalign" -c -v 4 "$apk" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Blue-Magic-v268-smoke-matrix
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          if-no-files-found: error

  android-smoke:
    name: android-${{ matrix.api }}
    needs: build-matrix-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api: 23
            arch: x86
            profile: Nexus 5
          - api: 26
            arch: x86_64
            profile: Nexus 5
          - api: 30
            arch: x86_64
            profile: Nexus 6
          - api: 34
            arch: x86_64
            profile: Nexus 6
          - api: 36
            arch: x86_64
            profile: Nexus 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Blue-Magic-v268-smoke-matrix
          path: /tmp/blue-magic-v268
      - name: Install and launch on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            set -eu
            adb install -r /tmp/blue-magic-v268/app-release.apk | tee /tmp/install.txt
            grep -q "Success" /tmp/install.txt
            adb logcat -c
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity | tee /tmp/start.txt
            grep -q "Status: ok" /tmp/start.txt
            sleep 3
            adb shell pidof com.profitloop.blueauto | grep -q '[0-9]'
            test -z "$(adb logcat -d -b crash 2>/dev/null | grep com.profitloop.blueauto || true)"

# Ephemeral compatibility matrix only. No production deploy, no permanent signing, no financial execution.
