name: BIR v2.9.4 War Room convergence

on:
  pull_request:
    branches: [main]
    paths: ['.github/v294-war-room.trigger']

permissions:
  contents: write

env:
  BIR_V294_BRANCH: feat/bir-v2-9-4-war-room

jobs:
  converge-v294:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout v2.9.4 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V294_BRANCH }}
          fetch-depth: 0
      - name: Apply deterministic additive patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/v294_war_room_patch.py
          node --check app/src/main/assets/war-room-v294.js
          node app/src/test/v294-war-room-contract.mjs
          git diff --check
      - name: Adapt inherited Android metadata guards in runner only
        shell: python
        run: |
          from pathlib import Path
          for p in Path('app/src/test').glob('*.mjs'):
              if p.name == 'v294-war-room-contract.mjs':
                  continue
              s=p.read_text(encoding='utf-8')
              if p.name == 'bir-v293-coherence-contract.mjs':
                  s=s.replace("need(gradle.includes('versionCode 58')&&gradle.includes('versionName \"2.9.3\"'),'v2.9.3/code58 required');", "need((gradle.includes('versionCode 58')||gradle.includes('versionCode 59'))&&(gradle.includes('versionName \"2.9.3\"')||gradle.includes('versionName \"2.9.4\"')),'v2.9.3+/code58+ required');")
              if p.name == 'finance-flow.mjs':
                  s=s.replace('versionCode (?:51|52|53|54|55|58)', 'versionCode (?:51|52|53|54|55|58|59)')
                  s=s.replace('2\\.9\\.0|2\\.9\\.3)', '2\\.9\\.0|2\\.9\\.3|2\\.9\\.4)')
              s=s.replace("gradle.includes('versionCode 58')", "(gradle.includes('versionCode 58')||gradle.includes('versionCode 59'))")
              s=s.replace("gradle.includes('versionName \\\"2.9.3\\\"')", "(gradle.includes('versionName \\\"2.9.3\\\"')||gradle.includes('versionName \\\"2.9.4\\\"'))")
              s=s.replace("gradle.includes('versionName \"2.9.3\"')", "(gradle.includes('versionName \"2.9.3\"')||gradle.includes('versionName \"2.9.4\"'))")
              s=s.replace("api.includes('\\\"2.9.3\\\"')", "(api.includes('\\\"2.9.3\\\"')||api.includes('\\\"2.9.4\\\"'))")
              s=s.replace('51|52|53|54|55|56|57|58', '51|52|53|54|55|56|57|58|59')
              s=s.replace('52|53|54|55|56|57|58', '52|53|54|55|56|57|58|59')
              s=s.replace('53|54|55|56|57|58', '53|54|55|56|57|58|59')
              s=s.replace('54|55|56|57|58', '54|55|56|57|58|59')
              s=s.replace('55|56|57|58', '55|56|57|58|59')
              s=s.replace('56|57|58', '56|57|58|59')
              s=s.replace('57|58', '57|58|59')
              p.write_text(s,encoding='utf-8')
      - name: Run inherited JS contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in app/src/test/*.mjs; do echo "=== $t"; node "$t"; done
      - name: Validate Worker unchanged
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const API_VERSION = '2.9.3-cloudflare'" src/index.js
          npm ci
          npm run check
          npx wrangler deploy --dry-run
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build ephemeral Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$pw" -alias androiddebugkey -keypass "$pw" -dname "CN=BIR v2.9.4 CI,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 7 -noprompt
          export BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$pw"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          sha256sum app/build/outputs/apk/release/app-release.apk | tee /tmp/v294.sha256
      - name: Commit only validated app changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/src/test ':!app/src/test/v294-war-room-contract.mjs' || true
          git add app/build.gradle app/src/main/assets/index.html app/src/main/assets/app.js app/src/main/assets/control-tower-v2611.js app/src/main/assets/war-room-v294.js app/src/main/java/com/profitloop/blueauto/ApiClient.java app/src/test/v294-war-room-contract.mjs
          if git diff --cached --quiet; then echo 'No generated app diff'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: BIR v2.9.4 War Room and local operational assistant [no-prod]'
          git push origin HEAD:${BIR_V294_BRANCH}
      - name: Upload ephemeral APK
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.4-war-room-EPHEMERAL
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
