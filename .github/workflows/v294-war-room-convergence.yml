name: BIR v2.9.4 War Room convergence

on:
  pull_request:
    branches: [main]
    paths: ['.github/v294-war-room.trigger']

permissions:
  contents: write

concurrency:
  group: bir-v294-war-room-convergence
  cancel-in-progress: true

env:
  BIR_V294_BRANCH: feat/bir-v2-9-4-war-room
  BIR_PERMANENT_FIXTURE_SHA: eef53c4bf483ffc2557a57b0715561412f4c7e10

jobs:
  converge-v294:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout v2.9.4 candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V294_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic UI-only War Room patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/v294_war_room_patch.py
          node --check app/src/main/assets/war-room-v294.js
          node app/src/test/v294-war-room-contract.mjs
          git diff --check
          git diff --exit-code -- cloudflare/src cloudflare/migrations

      - name: Restore permanent-release hygiene fixture in runner only
        shell: bash
        run: |
          set -euo pipefail
          git show "$BIR_PERMANENT_FIXTURE_SHA:.github/workflows/build.yml" > .github/workflows/build.yml
          grep -q 'publish_permanent' .github/workflows/build.yml

      - name: Adapt inherited Android metadata guards in runner only
        shell: python
        run: |
          from pathlib import Path
          import re
          for p in Path('app/src/test').glob('*.mjs'):
              if p.name == 'v294-war-room-contract.mjs':
                  continue
              s=p.read_text(encoding='utf-8'); old=s
              if p.name == 'bir-v269-functional-contract.mjs':
                  s=s.replace("if(!js.includes(\"bir_active_module_v269')||'reports'\")) throw new Error('BIR home is not default');", "if(!(js.includes(\"bir_active_module_v269')||'reports'\")||js.includes(\"var saved='reports'\"))) throw new Error('BIR home is not default');")
              if p.name == 'bir-v293-coherence-contract.mjs':
                  s=s.replace("need(gradle.includes('versionCode 58')&&gradle.includes('versionName \"2.9.3\"'),'v2.9.3/code58 required');", "need((gradle.includes('versionCode 58')||gradle.includes('versionCode 59'))&&(gradle.includes('versionName \"2.9.3\"')||gradle.includes('versionName \"2.9.4\"')),'v2.9.3+/code58+ required');")
              if p.name == 'finance-flow.mjs':
                  s=s.replace('versionCode (?:51|52|53|54|55|58)', 'versionCode (?:51|52|53|54|55|58|59)')
                  s=s.replace('2\\.9\\.0|2\\.9\\.3)', '2\\.9\\.0|2\\.9\\.3|2\\.9\\.4)')
              if p.name == 'v291-field-recovery-contract.mjs':
                  s=s.replace("must(api.includes('payload.put(\"app_version\", \"2.9.1\");')||api.includes('payload.put(\"app_version\", \"2.9.3\");'),'v2.9.1 heartbeat telemetry missing');", "must(api.includes('payload.put(\"app_version\", \"2.9.1\");')||api.includes('payload.put(\"app_version\", \"2.9.3\");')||api.includes('payload.put(\"app_version\", \"2.9.4\");'),'v2.9.1+ heartbeat telemetry missing');")
              s=re.sub(r'versionCode \(\?:([0-9|]+)\)',lambda m:'versionCode (?:'+m.group(1)+('|59' if '59' not in m.group(1).split('|') else '')+')',s)
              s=s.replace('2\\.9\\.3)"', '2\\.9\\.3|2\\.9\\.4)"')
              s=s.replace("gradle.includes('versionCode 58')", "(gradle.includes('versionCode 58')||gradle.includes('versionCode 59'))")
              s=s.replace("gradle.includes('versionName \\\"2.9.3\\\"')", "(gradle.includes('versionName \\\"2.9.3\\\"')||gradle.includes('versionName \\\"2.9.4\\\"'))")
              s=s.replace("gradle.includes('versionName \"2.9.3\"')", "(gradle.includes('versionName \"2.9.3\"')||gradle.includes('versionName \"2.9.4\"'))")
              s=s.replace("api.includes('\\\"2.9.3\\\"')", "(api.includes('\\\"2.9.3\\\"')||api.includes('\\\"2.9.4\\\"'))")
              if s!=old: p.write_text(s,encoding='utf-8')

      - name: Run all inherited Android and WebView contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in app/src/test/*.mjs; do echo "=== $t"; node "$t"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/pilotage-v292.js
          node --check app/src/main/assets/war-room-v294.js

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Validate unchanged Worker without production mutation
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const API_VERSION = '2.9.3-cloudflare'" src/index.js
          npm ci
          npm run check
          npx wrangler deploy --dry-run

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build ephemeral Release only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$pw" -alias androiddebugkey -keypass "$pw" -dname "CN=BIR v2.9.4 CI,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 7 -noprompt
          export BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$pw"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/v294-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='59' versionName='2.9.4'" /tmp/v294-badging.txt
          if "$build_tools/aapt" dump badging "$apk" | grep -q application-debuggable; then echo 'Release debuggable'; exit 1; fi
          sha256sum "$apk" | tee /tmp/v294.sha256

      - name: Commit only validated v2.9.4 application source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/build.yml || true
          git checkout -- app/src/test || true
          git add app/build.gradle \
            app/src/main/java/com/profitloop/blueauto/ApiClient.java \
            app/src/main/assets/app.js \
            app/src/main/assets/index.html \
            app/src/main/assets/control-tower-v2611.js \
            app/src/main/assets/war-room-v294.js \
            app/src/test/v294-war-room-contract.mjs
          if git diff --cached --quiet; then
            echo 'No generated application diff'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: BIR v2.9.4 War Room and local operational assistant [no-prod]'
            git push origin HEAD:${BIR_V294_BRANCH}
          fi
          git rev-parse HEAD | tee /tmp/v294-source-sha.txt

      - name: Upload ephemeral APK and source identity
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.4-war-room-EPHEMERAL
          path: |
            app/build/outputs/apk/release/app-release.apk
            /tmp/v294.sha256
            /tmp/v294-badging.txt
            /tmp/v294-source-sha.txt
          retention-days: 7
          if-no-files-found: error
