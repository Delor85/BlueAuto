name: BIR v2.9.4 War Room convergence

on:
  pull_request:
    branches: [main]
    paths: ['.github/v294-war-room.trigger']

permissions:
  contents: write

concurrency:
  group: bir-v294-war-room-convergence
  cancel-in-progress: true

env:
  BIR_V294_BRANCH: feat/bir-v2-9-4-war-room

jobs:
  converge-v294:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout single v2.9.4 convergence branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V294_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic War Room Copilot convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/v294_war_room_copilot_convergence.py
          node --check app/src/main/assets/war-room-v294.js
          node app/src/test/v294-war-room-contract.mjs
          git diff --check

      - name: Adapt inherited version metadata in runner only
        shell: python
        run: |
          from pathlib import Path
          import re
          for p in Path('app/src/test').glob('*.mjs'):
              if p.name == 'v294-war-room-contract.mjs':
                  continue
              s=p.read_text(encoding='utf-8'); old=s
              if "versionCode 59" not in s and "gradle.includes('versionCode 58')" in s:
                  s=s.replace("gradle.includes('versionCode 58')", "(gradle.includes('versionCode 58')||gradle.includes('versionCode 59'))")
              if 'versionName \"2.9.4\"' not in s and "gradle.includes('versionName \"2.9.3\"')" in s:
                  s=s.replace("gradle.includes('versionName \"2.9.3\"')", "(gradle.includes('versionName \"2.9.3\"')||gradle.includes('versionName \"2.9.4\"'))")
              s=re.sub(r'versionCode \(\?:([0-9|]+)\)',lambda m:'versionCode (?:'+m.group(1)+('|59' if '59' not in m.group(1).split('|') else '')+')',s)
              if '2.9.4-cloudflare' not in s:
                  s=s.replace('worker.includes("2.9.3-cloudflare")','(worker.includes("2.9.3-cloudflare")||worker.includes("2.9.4-cloudflare"))')
                  s=s.replace('worker.includes("const API_VERSION = \'2.9.3-cloudflare\'")','(worker.includes("const API_VERSION = \'2.9.3-cloudflare\'")||worker.includes("const API_VERSION = \'2.9.4-cloudflare\'"))')
              if 'api client version mismatch' in s and '2.9.4' not in s:
                  s=s.replace("api.includes('\\\"2.9.3\\\"')", "(api.includes('\\\"2.9.3\\\"')||api.includes('\\\"2.9.4\\\"'))")
              s=s.replace('2\\.9\\.3)"','2\\.9\\.(?:3|4))"') if '2\\.9\\.3)"' in s and '2\\.9\\.(?:3|4)' not in s else s
              if s!=old: p.write_text(s,encoding='utf-8')

      - name: Run all inherited Android and WebView contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in app/src/test/*.mjs; do echo "=== $t"; node "$t"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/pilotage-v292.js
          node --check app/src/main/assets/war-room-v294.js

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Validate changed Worker without production mutation
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npx wrangler deploy --dry-run

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build ephemeral Release only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$pw" -alias androiddebugkey -keypass "$pw" -dname "CN=BIR v2.9.4 CI,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 7 -noprompt
          export BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$pw"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/v294-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='59' versionName='2.9.4'" /tmp/v294-badging.txt
          if "$build_tools/aapt" dump badging "$apk" | grep -q application-debuggable; then echo 'Release debuggable'; exit 1; fi
          sha256sum "$apk" | tee /tmp/v294.sha256

      - name: Commit only validated v2.9.4 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/src/test ':!app/src/test/v294-war-room-contract.mjs' || true
          git add app/build.gradle \
            app/src/main/java/com/profitloop/blueauto/ApiClient.java \
            app/src/main/assets/app.js \
            app/src/main/assets/index.html \
            app/src/main/assets/control-tower-v2611.js \
            app/src/main/assets/war-room-v294.js \
            app/src/test/v294-war-room-contract.mjs \
            cloudflare/src/index.js
          if git diff --cached --quiet; then echo 'No generated source diff'; else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: BIR v2.9.4 War Room Copilot and free commission policy [no-prod]'
            git push origin HEAD:${BIR_V294_BRANCH}
          fi
          git rev-parse HEAD | tee /tmp/v294-source-sha.txt

      - name: Upload ephemeral APK and source identity
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.4-war-room-EPHEMERAL
          path: |
            app/build/outputs/apk/release/app-release.apk
            /tmp/v294.sha256
            /tmp/v294-source-sha.txt
          retention-days: 7
          if-no-files-found: error
