name: BIR v2.9.9.1 Full Android Qualification

on:
  pull_request:
    branches: [fix/bir-v2-9-9-reference-stability]
    paths:
      - 'app/**'
      - '.github/workflows/v2991-field-runtime-delivery.yml'
      - '.github/workflows/v2991-critical-permanent.yml'
      - 'docs/BIR_2.9.9.1_Audit_Livraison_Reprise_2026-08-24.md'

permissions:
  contents: read

concurrency:
  group: bir-v2991-full-${{ github.ref }}
  cancel-in-progress: true

env:
  BIR_BASE_SHA: a13bafc76aa23157bb409a72904f4bc64f5cf815

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove APK-only boundary and release identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_BASE_SHA" -- cloudflare
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          grep -q 'versionCode 65' app/build.gradle
          grep -q 'versionName "2.9.9.1"' app/build.gradle
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate unchanged Worker source locally
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)
      - name: Run every historical anti-regression contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          cp app/build.gradle /tmp/build.gradle.v2991
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 65','versionCode 64').replace('versionName "2.9.9.1"','versionName "2.9.9"')
          p.write_text(s)
          PY
          for test_file in app/src/test/*.mjs; do
            if [ "$test_file" = "app/src/test/v2991-field-runtime-contract.mjs" ]; then continue; fi
            echo "== historical: $test_file =="
            node "$test_file"
          done
          mv /tmp/build.gradle.v2991 app/build.gradle
          node app/src/test/v2991-field-runtime-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/field-ops-v297.js
          node --check app/src/main/assets/intelligence-v297.js
          node --check app/src/main/assets/transaction-first-v298.js
          node --check app/src/main/assets/reference-stability-v299.js
          node --check app/src/main/assets/field-runtime-v2991.js
          git diff --exit-code -- app/build.gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Build exact qualification APK with isolated temporary key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR 2.9.9.1 Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk
      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/aapt" dump badging "$apk" | tee /tmp/v2991-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='65' versionName='2.9.9.1'" /tmp/v2991-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v2991-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v2991-badging.txt
          ! grep -q 'application-debuggable' /tmp/v2991-badging.txt
          sha256sum "$apk" | tee /tmp/v2991-qualification.sha256
          git rev-parse HEAD | tee /tmp/v2991-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.1-Full-Qualification
          retention-days: 7
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk
            /tmp/v2991-badging.txt
            /tmp/v2991-qualification.sha256
            /tmp/v2991-source-sha.txt

  android-matrix:
    name: Android ${{ matrix.android }} / API ${{ matrix.api }}
    needs: validate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {android: '6', api: 23, arch: x86, profile: 'Nexus 5'}
          - {android: '7', api: 24, arch: x86, profile: 'Nexus 5'}
          - {android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '9', api: 28, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '10', api: 29, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '12', api: 31, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '13', api: 33, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '14', api: 34, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '15', api: 35, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '16', api: 36, arch: x86_64, profile: 'Nexus 5X'}
    steps:
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.1-Full-Qualification
          path: apk
      - name: Boot, install, launch and interact with exact candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: >-
            set -eu; adb wait-for-device; ready=0; for i in $(seq 1 60); do if adb shell service check package 2>/dev/null | grep -qi found && adb shell cmd package list packages >/dev/null 2>&1 && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 5; done; test "$ready" = 1; sleep 5; apk="$(find apk -type f -name 'BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk' -print -quit)"; test -s "$apk"; installed=0; for i in 1 2 3; do if adb install --no-streaming "$apk"; then installed=1; break; fi; sleep 10; done; test "$installed" = 1; adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=65'; adb logcat -c || true; adb shell am start -W -n com.profitloop.blueauto/.MainActivity > /tmp/start.txt; grep -Eq 'Status: ok|Complete' /tmp/start.txt; sleep 6; adb shell pidof com.profitloop.blueauto >/dev/null; adb exec-out screencap -p > /tmp/before.png; test -s /tmp/before.png; adb shell input tap 540 1450 || true; sleep 2; adb shell input swipe 540 1500 540 650 350 || true; sleep 2; adb exec-out screencap -p > /tmp/after.png; test -s /tmp/after.png; adb shell pidof com.profitloop.blueauto >/dev/null; adb logcat -d > /tmp/logcat.txt || true; ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto|ANR in com.profitloop.blueauto|Render process.*gone' /tmp/logcat.txt

  qualification-summary:
    name: Full Android 6–16 qualification complete
    needs: [validate-build, android-matrix]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'B.I.R. 2.9.9.1 qualification passed on Android 6 through 16.'
          echo 'Permanent signing remains isolated in the push-only critical delivery workflow.'
