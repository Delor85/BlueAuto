name: BIR v2.8 Metadata Finalize

on:
  push:
    branches: [feat/bir-v2-8-operations-admin]
    paths: [.github/authorized-v280-metadata.trigger]

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout v2.8 branch
        uses: actions/checkout@v5
        with:
          ref: feat/bir-v2-8-operations-admin
          fetch-depth: 0
      - name: Prove production remains forbidden
        run: |
          set -euo pipefail
          grep -q '^production_worker_deploy=forbidden$' .github/authorized-v280-metadata.trigger
          grep -q '^d1_migration=forbidden$' .github/authorized-v280-metadata.trigger
          grep -q '^pr4_merge=forbidden$' .github/authorized-v280-metadata.trigger
          grep -q '^permanent_signing=forbidden$' .github/authorized-v280-metadata.trigger
      - name: Finalize v2.8 metadata and launcher contract
        run: python3 .github/scripts/v280_metadata_finalize.py
      - name: Validate D1 migration chain locally
        run: python3 .github/scripts/v280_schema_smoke.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker source without deployment
        working-directory: cloudflare
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node --check src/index.js
      - name: Validate inherited and v2.8 contracts
        run: |
          set -euo pipefail
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          node app/src/test/v2610-control-tower.mjs
          node app/src/test/v2611-finalization-contract.mjs
          node app/src/test/v2611-shell-contract.mjs
          node app/src/test/v270-finalization-contract.mjs
          node app/src/test/v270-owner-mock-contract.mjs
          node app/src/test/v271-field-stabilization-contract.mjs
          node app/src/test/v280-operations-admin-contract.mjs
          node --check app/src/main/assets/balance-engine-v280.js
          node --check app/src/main/assets/control-tower-v280.js
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Prepare ephemeral CI key
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname "CN=BIR v2.8 Metadata Final,O=ProfitLoop,C=CM" -keyalg RSA -keysize 2048 -validity 30 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Compile Android source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Commit source metadata only
        run: |
          set -euo pipefail
          git config user.name "Delor85"
          git config user.email "mbolodelorpro@gmail.com"
          git add app cloudflare
          if git diff --cached --quiet; then
            echo 'No source change.'
          else
            git commit -m 'chore: finalize BIR v2.8 source metadata and launcher contract [v280-source]'
            git push origin HEAD:feat/bir-v2-8-operations-admin
          fi
