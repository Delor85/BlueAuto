name: BIR v2.6.10 Field Control Tower Integration

on:
  push:
    branches: [fix/bir-v2-6-10-field-control-tower]
    paths:
      - '.github/workflows/v2610-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact field branch
        uses: actions/checkout@v5
        with:
          ref: fix/bir-v2-6-10-field-control-tower
          fetch-depth: 0

      - name: Reconstruct and apply exact local patch
        run: |
          set -euo pipefail
          cat .github/patches/v2610/*.part > /tmp/v2610.patch.gz.b64
          base64 --decode /tmp/v2610.patch.gz.b64 | gzip -dc > /tmp/v2610.patch
          git apply -p1 --check /tmp/v2610.patch
          git apply -p1 /tmp/v2610.patch
          git diff --check

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Ephemeral validation signing only
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          keytool -genkeypair -v -keystore .pilot-signing/debug.keystore -storepass fieldvalidate -alias androiddebugkey -keypass fieldvalidate -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=BIR v2610 Field Validation,O=Blue Magic,C=CM' >/dev/null 2>&1
          echo 'BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=fieldvalidate' >> "$GITHUB_ENV"

      - name: Full Worker and historical regression suite
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/v2610-field-control-tower.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/platform-v267.js
          node --check cloudflare/src/index.js
          node --check cloudflare/test/integration.mjs

      - name: Android tests and real Release compilation
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging app/build/outputs/apk/release/app-release.apk | tee /tmp/v2610-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='50' versionName='2.6.10'" /tmp/v2610-badging.txt
          if grep -q 'application-debuggable' /tmp/v2610-badging.txt; then exit 1; fi

      - name: Persist only validated business source
        run: |
          set -euo pipefail
          rm -rf .github/patches/v2610 .github/patches/v2610-field-control-tower.patch.gz.b64 .github/workflows/v2610-integrate.yml
          git add -A
          git diff --cached --check
          git config user.name 'Delor85'
          git config user.email 'mbolodelorpro@gmail.com'
          git commit -m 'feat: stabilize BIR v2.6.10 field control tower'
          git push origin HEAD:fix/bir-v2-6-10-field-control-tower

      - name: Upload tested ephemeral candidate
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.6.10-Field-Control-Tower-Candidate
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
