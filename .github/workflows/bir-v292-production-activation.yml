name: BIR v2.9.2 Production Activation

on:
  pull_request:
    branches: [main]
    paths: ['.github/v292-production.trigger']

permissions:
  contents: read

concurrency:
  group: bir-v292-production-activation
  cancel-in-progress: false

env:
  BIR_V292_SOURCE_SHA: f123e766271511c6270305c5641ab4db93401c99
  BIR_PRODUCTION_HEALTH_URL: https://blue-magic-api.mbolodelorpro.workers.dev/api?action=health

jobs:
  activate-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact validated v2.9.2 source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_V292_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove authorization exact source and immutable boundaries
        env:
          AUTHORIZED_TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIR_V292_SOURCE_SHA"
          git show "$AUTHORIZED_TRIGGER_SHA:.github/v292-production.trigger" > /tmp/bir-v292-production-trigger.txt
          grep -q '^authorization=user-approved-free-premium-2026-08-18$' /tmp/bir-v292-production-trigger.txt
          grep -q '^source_sha=f123e766271511c6270305c5641ab4db93401c99$' /tmp/bir-v292-production-trigger.txt
          grep -q '^release=2.9.2$' /tmp/bir-v292-production-trigger.txt
          grep -q '^scope=worker-2.9.2-no-d1-change$' /tmp/bir-v292-production-trigger.txt
          grep -q '^modes=REMOTE,ROBOT$' /tmp/bir-v292-production-trigger.txt
          grep -q '^premium_for_all=free$' /tmp/bir-v292-production-trigger.txt
          grep -q '^financial_assist=forbidden$' /tmp/bir-v292-production-trigger.txt
          grep -q '^sms_fallback=forbidden$' /tmp/bir-v292-production-trigger.txt
          grep -q '^pr4_merge=forbidden$' /tmp/bir-v292-production-trigger.txt
          grep -q 'versionCode 57' app/build.gradle
          grep -q 'versionName "2.9.2"' app/build.gradle
          grep -q "const API_VERSION = '2.9.2-cloudflare'" cloudflare/src/index.js
          grep -q "case 'ops_assist'" cloudflare/src/index.js
          grep -q 'premium_for_all: true' cloudflare/src/index.js
          grep -q 'hierarchical_rescue: true' cloudflare/src/index.js
          grep -q "e.severity IN ('HOT','CRITICAL')" cloudflare/src/index.js
          ! grep -q 'android.permission.SEND_SMS' app/src/main/AndroidManifest.xml
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime and production config
        working-directory: cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          node --check src/index.js
          node --check src/production-v280.js
          node scripts/prepare-production-config.mjs
          grep -q '"main": "src/production-v280.js"' wrangler.production.jsonc
          grep -q '"keep_vars": true' wrangler.production.jsonc
          npx wrangler deploy --dry-run --config wrangler.production.jsonc

      - name: Prove D1 0009 ready and no schema mutation required
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list blue-magic --remote --config wrangler.production.jsonc | tee /tmp/bir-v292-migrations.txt
          grep -q 'No migrations to apply' /tmp/bir-v292-migrations.txt
          npx wrangler d1 execute blue-magic --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sync_wake_requests'" | tee /tmp/bir-v292-schema-proof.txt
          grep -q 'sync_wake_requests' /tmp/bir-v292-schema-proof.txt
          npx wrangler deployments status --config wrangler.production.jsonc --json | tee /tmp/bir-v292-deployment-before.json

      - name: Deploy exact BIR v2.9.2 Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc | tee /tmp/bir-v292-deploy.txt
          npx wrangler deployments status --config wrangler.production.jsonc --json | tee /tmp/bir-v292-deployment-after.json

      - name: Verify production v2.9.2 after propagation
        id: health
        working-directory: cloudflare
        run: |
          set -euo pipefail
          rm -f /tmp/bir-v292-health.json /tmp/bir-v292-health-attempts.txt
          for attempt in $(seq 1 15); do
            echo "health attempt $attempt/15" | tee -a /tmp/bir-v292-health-attempts.txt
            if curl --fail --max-time 20 "$BIR_PRODUCTION_HEALTH_URL" -o /tmp/bir-v292-health.json; then
              cat /tmp/bir-v292-health.json | tee -a /tmp/bir-v292-health-attempts.txt
              if node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/bir-v292-health.json','utf8'));if(h.ok!==true||!h.data)process.exit(2);const d=h.data;if(d.version!=='2.9.2-cloudflare')process.exit(3);if(d.database!=='online')process.exit(4);const c=d.capabilities||{};for(const k of ['premium_for_all','hierarchical_rescue','simple_pilotage','force_sync','offline_sync','bir_relay','free_ops_cockpit','super_admin'])if(c[k]!==true)process.exit(5);if(JSON.stringify(c.effective_modes)!==JSON.stringify(['REMOTE','ROBOT']))process.exit(6);"; then
                echo 'BIR v2.9.2 production health OK.'
                exit 0
              fi
            fi
            sleep 4
          done
          echo '::error::BIR v2.9.2 did not become healthy inside the propagation window.'
          exit 1

      - name: Roll back Worker automatically if v2.9.2 health fails
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npx wrangler rollback --config wrangler.production.jsonc --message 'Automatic rollback: BIR v2.9.2 production health gate failed'
          sleep 5
          curl --fail --retry 5 --retry-delay 3 --max-time 20 "$BIR_PRODUCTION_HEALTH_URL" -o /tmp/bir-v292-health-after-rollback.json
          cat /tmp/bir-v292-health-after-rollback.json

      - name: Publish activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.2-production-activation-evidence
          path: |
            /tmp/bir-v292-production-trigger.txt
            /tmp/bir-v292-migrations.txt
            /tmp/bir-v292-schema-proof.txt
            /tmp/bir-v292-deployment-before.json
            /tmp/bir-v292-deployment-after.json
            /tmp/bir-v292-deploy.txt
            /tmp/bir-v292-health.json
            /tmp/bir-v292-health-attempts.txt
            /tmp/bir-v292-health-after-rollback.json
          if-no-files-found: warn
          retention-days: 30
