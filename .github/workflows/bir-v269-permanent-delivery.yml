name: BIR v2.6.9 Permanent Functional Delivery

on:
  push:
    branches: [feat/bir-v2-6-9-functional]
    paths:
      - '.github/workflows/bir-v269-permanent-delivery.yml'

permissions:
  contents: read

env:
  AUTHORIZED_SOURCE_SHA: 88b47b4c49e8d20c37b8da5ecb3fae9b07d868b0
  EXPECTED_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  permanent-apk:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout delivery commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail closed on exact authorized source
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$AUTHORIZED_SOURCE_SHA"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/bir-v269-permanent-delivery.yml"
          test "$(git show HEAD^:app/build.gradle | grep -c 'versionCode 49')" -eq 1
          test "$(git show HEAD^:app/build.gradle | grep -c 'versionName \"2.6.9\"')" -eq 1

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Load permanent signing material without exposing it
        env:
          PERMANENT_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          PERMANENT_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PERMANENT_KEYSTORE_BASE64"
          test -n "$PERMANENT_KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$PERMANENT_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          permanent_password="$(printf '%s' "$PERMANENT_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$permanent_password"
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$permanent_password" >> "$GITHUB_ENV"

          cert="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$permanent_password" -alias androiddebugkey 2>/dev/null | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$EXPECTED_CERT_SHA256"

      - name: Full regression suite on permanent source
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
          cd ..
          node app/src/test/finance-flow.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v268-ux-performance.mjs
          node app/src/test/v268-platform-compat.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-native-status.mjs
          node app/src/test/v268-release-hygiene.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify permanent Release identity and signatures
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/bir-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='49' versionName='2.6.9'" /tmp/bir-badging.txt
          grep -q "sdkVersion:'23'" /tmp/bir-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/bir-badging.txt
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/bir-signature.txt
          cert="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/bir-signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$EXPECTED_CERT_SHA256"
          if "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'; then
            echo '::error::Permanent BIR APK must not be debuggable.'
            exit 1
          fi
          cp "$apk" BIR-Blue-Infinity-Retail-v2.6.9-Functional-Release.apk
          sha256sum BIR-Blue-Infinity-Retail-v2.6.9-Functional-Release.apk | tee BIR-v2.6.9-SHA256.txt

      - name: Upload permanent functional APK
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.6.9-Functional-Release-Permanent
          path: |
            BIR-Blue-Infinity-Retail-v2.6.9-Functional-Release.apk
            BIR-v2.6.9-SHA256.txt
          if-no-files-found: error

  upgrade-matrix:
    needs: permanent-apk
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api: 23
            arch: x86
            profile: Nexus 5
          - api: 26
            arch: x86_64
            profile: Nexus 5
          - api: 30
            arch: x86_64
            profile: Nexus 6
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Load same permanent signing key
        env:
          PERMANENT_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          PERMANENT_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          printf '%s' "$PERMANENT_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          permanent_password="$(printf '%s' "$PERMANENT_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$permanent_password"
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$permanent_password" >> "$GITHUB_ENV"

          git worktree add /tmp/blue-magic-v265 9b1d35f05630effa5e1683bfaa3da2195691ed61
          mkdir -p /tmp/blue-magic-v265/.pilot-signing
          cp .pilot-signing/debug.keystore /tmp/blue-magic-v265/.pilot-signing/debug.keystore
          (
            cd /tmp/blue-magic-v265
            BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$permanent_password" gradle --no-daemon :app:assembleDebug
          )

      - name: Download exact permanent BIR APK
        uses: actions/download-artifact@v4
        with:
          name: BIR-v2.6.9-Functional-Release-Permanent
          path: /tmp/bir-v269

      - name: Upgrade Blue Magic to BIR on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            set -eu
            old=/tmp/blue-magic-v265/app/build/outputs/apk/debug/app-debug.apk
            new=/tmp/bir-v269/BIR-Blue-Infinity-Retail-v2.6.9-Functional-Release.apk

            adb install "$old" | tee /tmp/old-install.txt
            grep -q 'Success' /tmp/old-install.txt
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity | tee /tmp/old-start.txt
            grep -q 'Status: ok' /tmp/old-start.txt
            adb shell run-as com.profitloop.blueauto mkdir -p files
            adb shell run-as com.profitloop.blueauto touch files/bir-v269-upgrade-marker

            adb install -r "$new" | tee /tmp/bir-upgrade.txt
            grep -q 'Success' /tmp/bir-upgrade.txt
            adb shell am force-stop com.profitloop.blueauto
            adb logcat -c || true
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity | tee /tmp/bir-start.txt
            grep -q 'Status: ok' /tmp/bir-start.txt
            adb shell run-as com.profitloop.blueauto ls files/bir-v269-upgrade-marker
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionName=2.6.9'
            adb shell pidof com.profitloop.blueauto
            if adb logcat -d -b crash 2>/dev/null | grep -q com.profitloop.blueauto; then adb logcat -d -b crash; exit 1; fi

            adb uninstall com.profitloop.blueauto | tee /tmp/bir-uninstall.txt
            grep -q 'Success' /tmp/bir-uninstall.txt
            adb install "$new" | tee /tmp/bir-clean-install.txt
            grep -q 'Success' /tmp/bir-clean-install.txt
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity | tee /tmp/bir-clean-start.txt
            grep -q 'Status: ok' /tmp/bir-clean-start.txt
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionName=2.6.9'
            if adb logcat -d -b crash 2>/dev/null | grep -q com.profitloop.blueauto; then adb logcat -d -b crash; exit 1; fi
