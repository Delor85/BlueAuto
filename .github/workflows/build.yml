name: Build Blue Magic APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier le backend Cloudflare
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Créer les paquets serveur
        run: |
          zip -qr BlueMagic-InfinityFree-htdocs.zip htdocs
          zip -qr BlueMagic-Cloudflare-backend.zip cloudflare \
            -x 'cloudflare/node_modules/*' 'cloudflare/.wrangler/*' 'cloudflare/.dev.vars'

      - name: Publier les paquets serveur
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Magic-v2-Serveurs
          path: |
            BlueMagic-InfinityFree-htdocs.zip
            BlueMagic-Cloudflare-backend.zip
          if-no-files-found: error

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restaurer la signature pilote
        uses: actions/cache@v4
        with:
          path: .pilot-signing/debug.keystore
          key: blue-magic-pilot-debug-keystore-v2

      - name: Préparer la signature pilote
        run: |
          mkdir -p .pilot-signing
          if [ ! -f .pilot-signing/debug.keystore ]; then
            keytool -genkeypair \
              -keystore .pilot-signing/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Blue Magic Pilot,O=ProfitLoop,C=CM" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Compiler l’APK de test
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier l’APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Magic-v2-Robot-Core
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
