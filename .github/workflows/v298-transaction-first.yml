name: BIR v2.9.8 Transaction First validation

on:
  push:
    branches: [fix/bir-v2-9-8-transaction-first-reference]
  pull_request:
    branches: [fix/bir-v2-9-7-field-resilience-ai]
    paths:
      - 'app/**'
      - '.github/workflows/v298-transaction-first.yml'
      - 'docs/BIR_2.9.8_Reference_Transaction_First_2026-08-23.md'

permissions:
  contents: read

concurrency:
  group: bir-v298-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove APK-only boundary and release identity
        run: |
          set -euo pipefail
          git diff --exit-code c92a62c2cccba62f2475a6544e92607e3d6e14e7 -- cloudflare
          grep -q 'versionCode 63' app/build.gradle
          grep -q 'versionName "2.9.8"' app/build.gradle
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main
      - name: Validate Worker source without deployment
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)
      - name: Validate historical core contracts
        run: |
          set -euo pipefail
          node app/src/test/finance-flow.mjs
          node app/src/test/bir-v269-functional-contract.mjs
          node app/src/test/bir-v293-coherence-contract.mjs
          node app/src/test/bir-v297-field-resilience.mjs
          node app/src/test/v268-control-plane.mjs
          node app/src/test/v268-field-contract.mjs
          node app/src/test/v268-transaction-ux.mjs
          node app/src/test/v268-responsive-management.mjs
          node app/src/test/v291-remote-sync-wake-contract.mjs
          node app/src/test/v295-identity-balance-sync-contract.mjs
          node app/src/test/v296-field-correction-contract.mjs
      - name: Validate Transaction-First behavior
        run: |
          set -euo pipefail
          node app/src/test/v297-intelligence-contract.mjs
          node app/src/test/v298-transaction-first-contract.mjs
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/war-room-v294.js
          node --check app/src/main/assets/field-ops-v297.js
          node --check app/src/main/assets/intelligence-v297.js
          node --check app/src/main/assets/transaction-first-v298.js
          test -s app/src/main/assets/transaction-first-v298.css
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Prepare ephemeral validation signature
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR v2.9.8 Validation,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Unit tests and Release build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify exact APK identity
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/zipalign" -c -v 4 "$apk"
          "$tools/aapt" dump badging "$apk" | tee /tmp/v298-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='63' versionName='2.9.8'" /tmp/v298-badging.txt
          grep -q "application-label:'B.I.R. — Blue Infinity Retail'" /tmp/v298-badging.txt
          ! grep -q 'application-debuggable' /tmp/v298-badging.txt
          sha256sum "$apk" | tee /tmp/v298-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.8-transaction-first-EPHEMERAL
          path: |
            app/build/outputs/apk/release/app-release.apk
            /tmp/v298-badging.txt
            /tmp/v298-apk.sha256
          retention-days: 7
          if-no-files-found: error

  smoke-install:
    needs: validate-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
            profile: Nexus 5
          - api: 26
            arch: x86_64
            profile: Nexus 5X
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.8-transaction-first-EPHEMERAL
          path: apk
      - name: Boot and launch exact candidate on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -eu
            adb install "$(find apk -type f -name 'app-release.apk' -print -quit)"
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=63'
            adb logcat -c || true
            adb shell am start -W -n com.profitloop.blueauto/.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -q 'com.profitloop.blueauto'
            adb logcat -d '*:E' > /tmp/v298-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto' /tmp/v298-logcat.txt
