name: Déployer Blue Magic sur Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-magic-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Récupérer la version validée
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Installer et tester le Worker
        run: |
          npm ci
          npm run check

      - name: Préparer le binding D1 sans publier son identifiant
        run: node scripts/prepare-production-config.mjs

      - name: Vérifier les migrations D1 en attente
        run: npx wrangler d1 migrations list blue-magic --remote --config wrangler.production.jsonc

      - name: Appliquer les migrations additives D1
        run: npx wrangler d1 migrations apply blue-magic --remote --config wrangler.production.jsonc

      - name: Déployer uniquement blue-magic-api
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Vérifier le Worker et la base après déploiement
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://blue-magic-api.mbolodelorpro.workers.dev/api?action=health"
