name: BIR v2.9.7 Permanent Authorized Delivery

on:
  pull_request_target:
    types: [synchronize]
    branches: [fix/bir-v2-9-5-identity-balance-sync]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: bir-v297-permanent-authorized-delivery
  cancel-in-progress: true

env:
  BIR_SOURCE_SHA: bd3401bf131eb647ea7cbeb2ad6c2213b691b20d
  BIR_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  permanent-build:
    if: >-
      github.event.pull_request.number == 67 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/bir-v2-9-7-field-resilience-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout exact validated application source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BIR_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove exact source and production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIR_SOURCE_SHA"
          git diff --exit-code a6cdf9edf7729cdcaa052ab51926b247064b6e23 -- cloudflare
          test ! -e cloudflare/migrations/0012_bir_v297.sql
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'versionCode 62' app/build.gradle
          grep -q 'versionName "2.9.7"' app/build.gradle
          grep -Fq 'new String[]{"REMOTE", "ROBOT"}' app/src/main/java/com/profitloop/blueauto/MainActivity.java
          ! grep -RniE 'sms[_ -]?fallback|financial_command_over_relay[[:space:]]*=[[:space:]]*true' app/src/main

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run all source contracts
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare && npm ci && npm run check)
          for test_file in app/src/test/*.mjs; do node "$test_file"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/war-room-v294.js
          node --check app/src/main/assets/field-ops-v297.js
          node --check app/src/main/assets/intelligence-v297.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore historical permanent signing key
        shell: bash
        env:
          PERMANENT_KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          PERMANENT_KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PERMANENT_KEYSTORE_BASE64"
          test -n "$PERMANENT_KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$PERMANENT_KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          password="$(printf '%s' "$PERMANENT_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$password"
          cert="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$cert" = "$BIR_CERT_SHA256"
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Test and build permanently signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.7-vc62-Permanent.apk

      - name: Verify permanent APK identity signature and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK=BIR-Blue-Infinity-Retail-v2.9.7-vc62-Permanent.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -c -v 4 "$APK" | tee BIR-v2.9.7-Permanent-zipalign.txt
          "$build_tools/aapt" dump badging "$APK" | tee BIR-v2.9.7-Permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='62' versionName='2.9.7'" BIR-v2.9.7-Permanent-badging.txt
          grep -q "application-label:'B.I.R. — Blue Infinity Retail'" BIR-v2.9.7-Permanent-badging.txt
          ! grep -q 'application-debuggable' BIR-v2.9.7-Permanent-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$APK" | tee BIR-v2.9.7-Permanent-verification.txt
          cert="$(grep -i 'Signer #1 certificate SHA-256 digest:' BIR-v2.9.7-Permanent-verification.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test "$cert" = "$BIR_CERT_SHA256"
          grep -qi 'Verified using v1 scheme.*true' BIR-v2.9.7-Permanent-verification.txt
          grep -qi 'Verified using v2 scheme.*true' BIR-v2.9.7-Permanent-verification.txt
          grep -qi 'Verified using v3 scheme.*true' BIR-v2.9.7-Permanent-verification.txt
          sha256sum "$APK" | tee BIR-v2.9.7-Permanent.sha256.txt
          apk_sha="$(awk '{print $1}' BIR-v2.9.7-Permanent.sha256.txt)"
          size="$(stat -c '%s' "$APK")"
          {
            echo "source_sha=$BIR_SOURCE_SHA"
            echo 'package=com.profitloop.blueauto'
            echo 'versionName=2.9.7'
            echo 'versionCode=62'
            echo 'minSdk=23'
            echo 'targetSdk=34'
            echo "apk_sha256=$apk_sha"
            echo "apk_size_bytes=$size"
            echo "certificate_sha256=$BIR_CERT_SHA256"
            echo 'signature_v1=true'
            echo 'signature_v2=true'
            echo 'signature_v3=true'
            echo 'zipalign=true'
            echo 'debuggable=false'
            echo 'production_mutation=false'
            echo 'pr_merged=false'
          } | tee BIR-v2.9.7-Permanent-release-info.txt
          echo "apk_sha=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload permanent APK
        uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.7-code62-PERMANENT
          retention-days: 90
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.7-vc62-Permanent.apk
            BIR-v2.9.7-Permanent.sha256.txt
            BIR-v2.9.7-Permanent-release-info.txt
            BIR-v2.9.7-Permanent-badging.txt
            BIR-v2.9.7-Permanent-verification.txt
            BIR-v2.9.7-Permanent-zipalign.txt

      - name: Publish delivery proof on PR 67
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha }}
          APK_SIZE: ${{ steps.verify.outputs.size }}
        run: |
          set -euo pipefail
          cat > /tmp/comment.md <<EOF
          BIR_V297_PERMANENT_DELIVERY_READY
          run_id=${{ github.run_id }}
          source_sha=$BIR_SOURCE_SHA
          artifact=BIR-v2.9.7-code62-PERMANENT
          package=com.profitloop.blueauto
          versionName=2.9.7
          versionCode=62
          apk_sha256=$APK_SHA
          apk_size_bytes=$APK_SIZE
          certificate_sha256=$BIR_CERT_SHA256
          signature_v1=true
          signature_v2=true
          signature_v3=true
          production_mutation=false
          pr_merged=false
          EOF
          gh pr comment 67 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
