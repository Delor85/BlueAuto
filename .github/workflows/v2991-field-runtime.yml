name: BIR v2.9.9.1 Field Runtime + Permanent APK

on:
  push:
    branches: [fix/bir-v2-9-9-1-field-runtime]
  pull_request:
    branches: [fix/bir-v2-9-9-reference-stability]
    paths:
      - 'app/**'
      - '.github/workflows/v2991-field-runtime.yml'
      - 'docs/BIR_2.9.9.1_Audit_Livraison_Reprise_2026-08-24.md'

permissions:
  contents: read

env:
  BIR_BASE_SHA: a13bafc76aa23157bb409a72904f4bc64f5cf815
  BIR_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove APK-only boundary and v2.9.9.1 identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_BASE_SHA" -- cloudflare
          grep -q 'versionCode 65' app/build.gradle
          grep -q 'versionName "2.9.9.1"' app/build.gradle
          grep -q 'applicationId "com.profitloop.blueauto"' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'targetSdk 34' app/build.gradle
          ! grep -RniE 'financial_command_over_relay[[:space:]]*=[[:space:]]*true|sms[_ -]?fallback' app/src/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker source locally only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci
          npm run check
      - name: Run every historical contract plus v2.9.9.1
        shell: bash
        run: |
          set -euo pipefail
          for test_file in app/src/test/*.mjs; do echo "== $test_file =="; node "$test_file"; done
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/field-ops-v297.js
          node --check app/src/main/assets/intelligence-v297.js
          node --check app/src/main/assets/transaction-first-v298.js
          node --check app/src/main/assets/reference-stability-v299.js
          node --check app/src/main/assets/field-runtime-v2991.js
          test -s app/src/main/assets/field-runtime-v2991.css
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Prepare ephemeral validation key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR 2.9.9.1 Validation,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Unit tests and exact Release build
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/aapt" dump badging "$apk" | tee /tmp/v2991-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='65' versionName='2.9.9.1'" /tmp/v2991-badging.txt
          grep -q "sdkVersion:'23'" /tmp/v2991-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/v2991-badging.txt
          ! grep -q 'application-debuggable' /tmp/v2991-badging.txt
          sha256sum "$apk" | tee /tmp/v2991-ephemeral.sha256
          git rev-parse HEAD | tee /tmp/v2991-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.1-field-runtime-EPHEMERAL
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            /tmp/v2991-badging.txt
            /tmp/v2991-ephemeral.sha256
            /tmp/v2991-source-sha.txt

  android-matrix:
    name: Android ${{ matrix.android }} / API ${{ matrix.api }}
    needs: validate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { android: '6', api: 23, arch: x86, profile: 'Nexus 5', target: google_apis }
          - { android: '7', api: 24, arch: x86, profile: 'Nexus 5', target: google_apis }
          - { android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '9', api: 28, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '10', api: 29, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '12', api: 31, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '13', api: 33, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '14', api: 34, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '15', api: 35, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
          - { android: '16', api: 36, arch: x86_64, profile: 'Nexus 5X', target: google_apis }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.1-field-runtime-EPHEMERAL
          path: apk
      - name: Install exact candidate and stress relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: ${{ matrix.target }}
          disable-animations: false
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            test -f apk/app-release.apk
            for i in 1 2 3 4; do adb install --no-streaming apk/app-release.apk && exit 0; sleep 8; adb kill-server || true; adb start-server; adb wait-for-device; done; exit 1
            adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=65'
            adb logcat -c || true
            for i in 1 2 3 4 5; do adb shell am force-stop com.profitloop.blueauto; adb shell am start -W -n com.profitloop.blueauto/.MainActivity >/tmp/start-$i.txt; grep -Eq 'Status: ok|Complete' /tmp/start-$i.txt; sleep 2; done
            adb shell dumpsys activity activities | grep -q 'com.profitloop.blueauto'
            adb logcat -d > /tmp/v2991-logcat.txt || true
            ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto|ANR in com.profitloop.blueauto|Render process.*gone' /tmp/v2991-logcat.txt

  permanent-apk:
    name: Permanent APK — historical certificate
    needs: [validate-build, android-matrix]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.1-field-runtime-EPHEMERAL
          path: validated
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: true
      - name: Load and prove historical permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$password"
          actual="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual" = "$BIR_CERT_SHA256"
          echo "BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build same source with permanent key
        shell: bash
        run: gradle --no-daemon :app:assembleRelease
      - name: Prove same application payload and permanent signature
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
          python3 - <<'PY'
          import hashlib, zipfile
          a='validated/app-release.apk'; b='BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk'
          def payload(path):
              out={}
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      u=n.upper()
                      if u.startswith('META-INF/') and (u.endswith('.SF') or u.endswith('.RSA') or u.endswith('.DSA') or u.endswith('MANIFEST.MF')):
                          continue
                      out[n]=hashlib.sha256(z.read(n)).hexdigest()
              return out
          pa,pb=payload(a),payload(b)
          assert pa==pb, 'application payload differs between validated and permanent APK'
          print('payload identical:',len(pa),'entries')
          PY
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee BIR-v2.9.9.1-Permanent-verification.txt
          actual="$(grep -i 'certificate SHA-256 digest:' BIR-v2.9.9.1-Permanent-verification.txt | head -1 | sed -E 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$BIR_CERT_SHA256"
          grep -qi 'Verified using v1 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt
          grep -qi 'Verified using v2 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt
          grep -qi 'Verified using v3 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt
          ! grep -q 'Signer #2' BIR-v2.9.9.1-Permanent-verification.txt
          "$bt/aapt" dump badging "$apk" | tee BIR-v2.9.9.1-Permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='65' versionName='2.9.9.1'" BIR-v2.9.9.1-Permanent-badging.txt
          sha256sum "$apk" | tee BIR-v2.9.9.1-Permanent.sha256.txt
          git rev-parse HEAD | tee BIR-v2.9.9.1-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.1-Permanent
          retention-days: 90
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
            BIR-v2.9.9.1-Permanent.sha256.txt
            BIR-v2.9.9.1-Permanent-verification.txt
            BIR-v2.9.9.1-Permanent-badging.txt
            BIR-v2.9.9.1-source-sha.txt
