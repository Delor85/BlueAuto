name: BIR v2.9.9.1 Critical Permanent Delivery

on:
  push:
    branches: [fix/bir-v2-9-9-1-field-runtime]
    paths-ignore:
      - 'docs/BIR_2.9.9.1_RELEASE_READY.md'
      - 'docs/BIR_2.9.9.1_Audit_Livraison_Reprise_2026-08-24.md'

permissions:
  contents: write

env:
  BIR_BASE_SHA: a13bafc76aa23157bb409a72904f4bc64f5cf815
  BIR_CERT_SHA256: f51e1d84271d3c4e229ce3cb424b36c8d564832b939e496bfc50352339b769b5

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Boundary, contracts and Worker-local validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BIR_BASE_SHA" -- cloudflare
          grep -q 'versionCode 65' app/build.gradle
          grep -q 'versionName "2.9.9.1"' app/build.gradle
          (cd cloudflare && npm ci && npm run check)
          cp app/build.gradle /tmp/v2991.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text()
          p.write_text(s.replace('versionCode 65','versionCode 64').replace('versionName "2.9.9.1"','versionName "2.9.9"'))
          PY
          for t in app/src/test/*.mjs; do [ "$t" = app/src/test/v2991-field-runtime-contract.mjs ] || node "$t"; done
          mv /tmp/v2991.gradle app/build.gradle
          node app/src/test/v2991-field-runtime-contract.mjs
          node --check app/src/main/assets/field-runtime-v2991.js
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.2', cache-read-only: true}
      - name: Build qualification APK with isolated temporary key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot-signing
          password="$(openssl rand -hex 32)"; echo "::add-mask::$password"
          keytool -genkeypair -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey -keypass "$password" -dname 'CN=BIR 2991 Qualification,O=ProfitLoop,C=CM' -keyalg RSA -keysize 2048 -validity 7 -noprompt
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk
          git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.1-Critical-Qualification
          retention-days: 7
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk
            source-sha.txt

  critical-android:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {android: '6', api: 23, arch: x86, profile: 'Nexus 5'}
          - {android: '8', api: 26, arch: x86_64, profile: 'Nexus 5X'}
          - {android: '11', api: 30, arch: x86_64, profile: 'Nexus 5X'}
    name: Critical Android ${{ matrix.android }} / API ${{ matrix.api }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.1-Critical-Qualification
          path: apk
      - name: Install, launch, interact and reject app crash/ANR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: >-
            set -eu; adb wait-for-device; ready=0; for i in $(seq 1 60); do if adb shell service check package 2>/dev/null | grep -qi found && adb shell cmd package list packages >/dev/null 2>&1 && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 5; done; test "$ready" = 1; sleep 12; apk="$(find apk -type f -name 'BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk' -print -quit)"; test -s "$apk"; installed=0; for i in 1 2 3; do if adb install --no-streaming "$apk"; then installed=1; break; fi; sleep 15; done; test "$installed" = 1; adb shell dumpsys package com.profitloop.blueauto | grep -q 'versionCode=65'; adb logcat -c || true; adb shell am start -W -n com.profitloop.blueauto/.MainActivity > /tmp/start.txt; grep -Eq 'Status: ok|Complete' /tmp/start.txt; sleep 8; adb shell pidof com.profitloop.blueauto >/dev/null; adb exec-out screencap -p > /tmp/before.png; test -s /tmp/before.png; adb shell input tap 540 1450 || true; sleep 2; adb shell input swipe 540 1500 540 650 350 || true; sleep 3; adb exec-out screencap -p > /tmp/after.png; test -s /tmp/after.png; adb shell pidof com.profitloop.blueauto >/dev/null; adb logcat -d > /tmp/logcat.txt || true; ! grep -E 'FATAL EXCEPTION.*com.profitloop.blueauto|Process: com.profitloop.blueauto|ANR in com.profitloop.blueauto|Render process.*gone' /tmp/logcat.txt

  permanent:
    needs: [build, critical-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: BIR-v2.9.9.1-Critical-Qualification
          path: validated
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.2', cache-read-only: true}
      - name: Rebuild exact source with historical permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLUE_MAGIC_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"; test -n "$KEYSTORE_PASSWORD"
          mkdir -p .pilot-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .pilot-signing/debug.keystore
          password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"; echo "::add-mask::$password"
          actual="$(keytool -list -v -keystore .pilot-signing/debug.keystore -storepass "$password" -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual" = "$BIR_CERT_SHA256"
          BLUE_MAGIC_PILOT_KEYSTORE_PASSWORD="$password" gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
      - name: Prove payload, package, signatures and hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,zipfile,glob
          a=glob.glob('validated/**/BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Qualification.apk',recursive=True)[0]
          b='BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk'
          def payload(p):
            out={}
            with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                u=n.upper()
                if u.startswith('META-INF/') and (u.endswith('.SF') or u.endswith('.RSA') or u.endswith('.DSA') or u.endswith('MANIFEST.MF')): continue
                out[n]=hashlib.sha256(z.read(n)).hexdigest()
            return out
          pa,pb=payload(a),payload(b); assert pa==pb, 'payload mismatch'; print('payload identical',len(pa))
          PY
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; apk=BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
          "$bt/zipalign" -c -v 4 "$apk" >/dev/null
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee BIR-v2.9.9.1-Permanent-verification.txt
          cert="$(grep -i 'certificate SHA-256 digest:' BIR-v2.9.9.1-Permanent-verification.txt | head -1 | sed -E 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"; test "$cert" = "$BIR_CERT_SHA256"
          grep -qi 'Verified using v1 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt; grep -qi 'Verified using v2 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt; grep -qi 'Verified using v3 scheme.*true' BIR-v2.9.9.1-Permanent-verification.txt; ! grep -q 'Signer #2' BIR-v2.9.9.1-Permanent-verification.txt
          "$bt/aapt" dump badging "$apk" | tee BIR-v2.9.9.1-Permanent-badging.txt
          grep -q "package: name='com.profitloop.blueauto' versionCode='65' versionName='2.9.9.1'" BIR-v2.9.9.1-Permanent-badging.txt
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"; printf '%s  %s\n' "$apk_sha" "$apk" > BIR-v2.9.9.1-Permanent.sha256.txt
          source_sha="$(git rev-parse HEAD)"; printf 'run_id=%s\nsource_sha=%s\nbase_sha=%s\napk_sha256=%s\ncertificate_sha256=%s\ncritical_android=6,8,11\ncloudflare_mutation=false\nd1_migration=false\nmerge=false\n' "$GITHUB_RUN_ID" "$source_sha" "$BIR_BASE_SHA" "$apk_sha" "$BIR_CERT_SHA256" > BIR-v2.9.9.1-Permanent-release-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIR-v2.9.9.1-Permanent
          retention-days: 90
          if-no-files-found: error
          path: |
            BIR-Blue-Infinity-Retail-v2.9.9.1-vc65-Permanent.apk
            BIR-v2.9.9.1-Permanent.sha256.txt
            BIR-v2.9.9.1-Permanent-verification.txt
            BIR-v2.9.9.1-Permanent-badging.txt
            BIR-v2.9.9.1-Permanent-release-info.txt
      - name: Record delivery pointer on branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 BIR-v2.9.9.1-Permanent-release-info.txt)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/BIR_2.9.9.1_RELEASE_READY.md?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
          args=(--method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/docs/BIR_2.9.9.1_RELEASE_READY.md" -f message='docs: record BIR 2.9.9.1 permanent delivery [skip ci]' -f content="$content" -f branch="$GITHUB_REF_NAME")
          [ -z "$current" ] || args+=(-f sha="$current")
          gh api "${args[@]}" >/dev/null
